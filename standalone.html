<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>새소리단 · 활동 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  /* ── 디자인 시안 팔레트 (네이비 + 마젠타) ───────────────────── */
  :root{
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f6fe; --border:#e4e2f5;
    --text:#16225c; --muted:#5b6591; --brand:#d61e5c; --brand-weak:#ffe1ec;
    --accent:#f5326b; --lav:#e9e5ff;
    --ok:#0e8a6a; --ok-weak:#d9f5ef; --warn:#a86a00; --warn-weak:#fff2d8;
    --danger:#d61e5c; --danger-weak:#ffe9f1;
    --shadow:0 14px 40px rgba(28,38,90,.11);
    --shadow-lg:0 20px 44px rgba(28,38,90,.16);
    /* 본문 최대 폭 — 좌우 여백을 한 곳에서 조절합니다 */
    --wrap:1560px;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1230; --surface:#171d47; --surface-2:#1e2555; --border:#2e3670;
      --text:#eceaff; --muted:#a2a9c6; --brand:#ff6f9c; --brand-weak:#3a1c39;
      --accent:#ff85ab; --lav:#2a2f63;
      --ok:#4ecfa8; --ok-weak:#0f3a31; --warn:#e8b055; --warn-weak:#3a2c10;
      --danger:#ff7a9c; --danger-weak:#3f1a2b;
      --shadow:0 14px 40px rgba(0,0,0,.42);
      --shadow-lg:0 20px 46px rgba(0,0,0,.5);
    }
  }
  h1,h2,h3{letter-spacing:-.03em; text-wrap:balance}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand); font-weight:700}
  button{font-family:inherit}
  /* ── 상단 내비게이션 (디자인 시안) ─────────────────────────── */
  .topnav{display:flex;align-items:center;gap:22px;padding:14px clamp(16px,4vw,48px);
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(22,34,92,.08);position:sticky;top:0;z-index:36}
  @media (prefers-color-scheme:dark){ .topnav{background:rgba(23,29,71,.92);border-bottom-color:rgba(255,255,255,.08)} }
  .brandbtn{display:flex;align-items:center;gap:11px;border:0;background:transparent;cursor:pointer;padding:0;flex:none}
  .brandbtn img{display:block;height:32px;width:auto}
  .brandbtn .wordmark{font-size:17px;font-weight:900;color:var(--text);letter-spacing:-.03em}
  .mainnav{display:flex;gap:2px;align-items:center;flex:1;flex-wrap:wrap}
  .nav-btn{border:0;background:transparent;font-family:inherit;font-size:14.5px;font-weight:700;
    color:#3a4478;padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
  @media (prefers-color-scheme:dark){ .nav-btn{color:var(--muted)} }
  .nav-btn:hover{color:var(--accent);background:var(--brand-weak)}
  .nav-btn.active{color:var(--brand);background:var(--brand-weak);font-weight:900}
  .nav-right{display:flex;align-items:center;gap:10px;flex:none}
  .whoami{font-size:13px;font-weight:800;color:var(--brand);white-space:nowrap}
  .whoami em{font-style:normal;color:var(--muted);font-weight:600;margin-left:5px}
  /* position+z-index — 드로어(.mainnav, z-index:40)가 열렸을 때도 이 버튼이 항상 눌리도록 위에 둡니다 */
  .navtoggle{display:none;position:relative;z-index:41;border:1px solid var(--border);background:var(--surface);color:var(--text);
    font-size:17px;padding:6px 12px;border-radius:12px;cursor:pointer}

  /* 단원 메뉴 드롭다운 */
  .navdrop{position:relative}
  .navdrop-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;background:var(--surface);
    border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:8px;display:none;z-index:40}
  .navdrop.open .navdrop-panel{display:block}
  .navdrop-panel .nav-btn{display:block;width:100%;text-align:left;font-size:14px;border-radius:12px}
  .navdrop-panel .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);padding:9px 14px 4px;font-weight:800}

  /* 푸터 (밝은 띠 — 고용노동부 원본 로고가 제 색으로 보이도록) */
  .sitefoot{background:var(--surface-2);color:var(--text);margin-top:0;
    border-top:1px solid var(--border)}
  .foot-in{max-width:var(--wrap);margin:0 auto;padding:56px clamp(16px,4vw,48px) 34px}
  .foot-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
    padding-bottom:26px}
  .foot-top h2{font-size:clamp(21px,2.6vw,28px);font-weight:900;letter-spacing:-.03em;margin:0;line-height:1.35}
  .foot-top h2 em{font-style:normal;color:var(--accent)}
  .foot-links{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  /* 배경 투명 원본 로고 — 밝은 푸터라 판을 깔지 않습니다 */
  .foot-logo{height:44px;width:auto;display:block}
  .foot-links button{border:0;background:transparent;color:var(--text);font-family:inherit;font-size:14px;
    font-weight:800;cursor:pointer;padding:0}
  .foot-links button:hover{color:var(--brand)}
  .foot-meta{border-top:1px solid var(--border);padding-top:20px;display:flex;
    align-items:center;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .foot-meta b{font-weight:800;color:var(--text)}
  .visits{display:flex;gap:16px;margin-left:auto}
  .visits div{text-align:right}
  .visits b{display:block;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.25;
    font-weight:900;color:var(--text)}
  .visits span{font-size:11px;color:var(--muted)}

  /* ---------- Buttons / forms ---------- */
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:999px;
    cursor:pointer;font-size:14px;font-weight:800}
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:linear-gradient(150deg,var(--accent),var(--brand));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(214,30,92,.26)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn.danger{color:var(--danger);border-color:var(--danger-weak)}
  label.field{display:block;margin-bottom:12px;font-size:13px;font-weight:600}
  label.field .req{color:var(--danger)}
  input,select,textarea{width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;
    background:var(--surface-2);color:var(--text);font-size:14px;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-weak);border-color:var(--brand)}
  .hint{font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

  /* ---------- Main / cards ---------- */
  .main{padding:30px clamp(16px,4vw,48px) 20px;max-width:var(--wrap);width:100%;margin:0 auto;min-height:60vh}
  .page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .page-head h1{margin:0 0 5px;font-size:clamp(24px,3.2vw,32px);font-weight:900}
  .page-head p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px;margin-bottom:18px}
  .card h2{margin:0 0 4px;font-size:19px;font-weight:900}
  .card h2+.sub{margin:0 0 16px;color:var(--muted);font-size:13px}
  .grid{display:grid;gap:14px}
  .grid.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800}
  .tag.recv{background:var(--surface-2);color:var(--muted)}
  .tag.review{background:var(--warn-weak);color:var(--warn)}
  .tag.approve{background:var(--ok-weak);color:var(--ok)}
  .tag.reject{background:var(--danger-weak);color:var(--danger)}
  .tag.brand{background:var(--brand-weak);color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  tr:hover td{background:var(--surface-2)}
  .table-wrap{overflow-x:auto}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat b{font-size:23px;display:block}
  .stat span{color:var(--muted);font-size:12.5px}
  .notice{background:var(--brand-weak);border:1px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}
  .notice.amber{background:var(--warn-weak);border-color:var(--warn)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:82px;height:82px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}

  /* ---------- Search ---------- */
  .searchbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .searchbar input{margin-top:0;flex:1;min-width:200px}
  .search-info{color:var(--muted);font-size:13px;margin-bottom:12px}
  mark{background:var(--warn-weak);color:inherit;border-radius:3px;padding:0 2px}

  /* ---------- Photo board ---------- */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:18px}
  .photo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .photo-card:hover{border-color:var(--brand)}
  .photo-card .hero{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-2)}
  .photo-card .hero.none{display:grid;place-items:center;color:var(--muted);font-size:34px}
  .photo-card .pc-body{padding:14px 16px 16px}
  .photo-card h3{margin:0 0 6px;font-size:15.5px;line-height:1.35}
  .photo-card .excerpt{color:var(--muted);font-size:13px;margin:0 0 10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .photo-card .meta{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}

  /* ---------- List board ---------- */
  .post-row{border-bottom:1px solid var(--border);padding:14px 0;cursor:pointer}
  .post-row:hover{background:var(--surface-2)}
  .post-row .pr-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .post-row h3{margin:0;font-size:15px}
  .post-row .excerpt{color:var(--muted);font-size:13px;margin:4px 0 0;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- Opinion / comments ---------- */
  .op-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
  .op-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .op-body{margin-top:8px;white-space:pre-wrap}
  .cmt-list{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
  .cmt{padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
  .cmt:last-child{border-bottom:0}
  .cmt .cm-meta{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}
  .cmt-form{display:flex;gap:8px;margin-top:10px}
  .cmt-form input{margin-top:0}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .cal-head b{font-size:18px}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cal .dow{background:var(--surface-2);text-align:center;font-size:12px;font-weight:600;padding:8px 0;color:var(--muted)}
  .cal .day{background:var(--surface);min-height:98px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    min-width:0}
  .cal .day:hover{background:var(--surface-2)}
  .cal .day.dim{color:var(--muted);opacity:.5}
  .cal .day.today .dnum{background:var(--brand);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
  .cal .day.sel{outline:2px solid var(--brand);outline-offset:-2px}
  .cal .dnum{font-size:12.5px;font-weight:600}
  .cal .sun .dnum{color:var(--danger)}
  .cal .ev{font-size:11px;background:var(--brand-weak);color:var(--brand);border-radius:5px;
    padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
    min-width:0;max-width:100%}

  /* ---------- Intro ---------- */
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
  .team{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface-2)}
  .team h3{margin:0 0 2px;font-size:15px}
  .team .lead{color:var(--brand);font-size:12.5px;font-weight:600;margin-bottom:6px}
  .team p{margin:0;font-size:13px;color:var(--muted)}
  .timeline{list-style:none;padding:0;margin:0}
  .timeline li{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
  .timeline li:last-child{border-bottom:0}
  .timeline .yr{flex:none;width:92px;font-weight:700;color:var(--brand);font-size:13.5px}
  .timeline .tx{font-size:14px}

  /* ---------- Overlays ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;place-items:center;z-index:50;padding:20px}
  .modal-bg.open{display:grid}
  .modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal .m-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
    align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
  .modal .m-head b{font-size:16px}
  .modal .m-body{padding:20px}
  .modal .m-body dt{font-size:12px;color:var(--muted);text-transform:uppercase;margin-top:14px}
  .modal .m-body dd{margin:2px 0 0;white-space:pre-wrap}
  .modal .big-imgs img{width:100%;border-radius:10px;margin-bottom:10px;display:block;cursor:zoom-in}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:60;padding:20px}
  .lightbox.open{display:grid}
  .lightbox img{max-width:95vw;max-height:92vh;border-radius:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);
    color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
    padding:30px;max-width:430px;width:100%}
  .login-card .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--accent),var(--brand));
    display:grid;place-items:center;color:#fff;font-size:24px;margin-bottom:14px}
  .role-opts{display:grid;gap:8px;margin:14px 0}
  .role-opt{border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .role-opt:hover{border-color:var(--brand)}
  .role-opt.sel{border-color:var(--brand);background:var(--brand-weak)}
  .role-opt input{width:auto;margin:3px 0 0}
  .role-opt b{font-size:14px}
  .role-opt span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  /* ════════════ 홈 (디자인 시안 그대로) ════════════ */
  .home{margin:-30px calc(-1 * clamp(16px,4vw,48px)) -20px}
  .home section{position:relative}
  .wrap-1180{max-width:var(--wrap);margin:0 auto;padding:0 clamp(16px,4vw,48px)}

  /* 1. 히어로 */
  .hero{background:var(--surface);padding:56px 0 66px;overflow:hidden}
  .hero .blob{position:absolute;pointer-events:none;z-index:0}
  .hero .blob.a{left:-160px;bottom:-180px;width:460px;height:420px;background:#f3f2fd;
    border-radius:48% 52% 56% 44%/52% 44% 56% 48%}
  .hero .blob.b{right:-320px;top:-132px;width:820px;height:640px;background:#ffe1ec;
    border-radius:52% 48% 44% 56%/56% 46% 54% 44%}
  .hero-in{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center}
  .hero .eyebrow{font-size:clamp(16px,1.35vw,19px);font-weight:800;color:var(--brand);margin-bottom:16px}
  .hero h1{font-size:clamp(38px,4.6vw,62px);font-weight:900;line-height:1.2;letter-spacing:-.045em;
    margin:0 0 22px;word-break:keep-all}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero .lede{margin:0 0 30px;font-size:clamp(16.5px,1.7vw,22px);line-height:1.8;color:var(--muted);
    word-break:keep-all;max-width:640px}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap}
  .hero .cta .btn{padding:15px 27px;font-size:15.5px;min-height:52px}
  .btn.outline{border:1.5px solid var(--text);background:var(--surface);color:var(--text);box-shadow:none}
  .hero-art{position:relative;display:flex;align-items:center;justify-content:center;min-height:440px}
  .hero-art img{display:block;width:min(124%,900px);margin-right:-8%;
    filter:drop-shadow(0 22px 34px rgba(28,38,90,.16));animation:bob 6.4s ease-in-out infinite}
  .bubble{position:absolute;padding:11px 16px;font-weight:800;font-size:13.5px;white-space:nowrap;
    box-shadow:0 14px 40px rgba(28,38,90,.14);z-index:3}
  .bubble.l{left:-6px;top:26px;background:var(--surface);color:var(--text);border-radius:18px 18px 18px 4px}
  .bubble.r{right:-10px;bottom:96px;background:var(--text);color:#fff;border-radius:18px 18px 4px 18px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(1deg)}}

  /* 2. 이런 생각 */
  .thoughts{border-radius:32px;background:#ffeef5;padding:44px 40px 52px;overflow:hidden}
  .thought-wrap{display:flex;flex-wrap:wrap;gap:18px 22px;justify-content:center;align-items:flex-start;margin-bottom:34px}
  .thought{background:#fff;color:#16225c;font-weight:800;line-height:1.5;word-break:keep-all;
    box-shadow:0 10px 26px rgba(28,38,90,.1);font-size:23px;max-width:440px;padding:20px 27px;
    transition:transform .25s ease, box-shadow .25s ease}
  .thought:hover{transform:translateY(-7px) scale(1.05);box-shadow:0 18px 36px rgba(28,38,90,.18)}
  .thoughts .mid{position:relative;text-align:center;padding:120px 0 10px}
  .thoughts .mid-art{position:absolute;left:0;right:0;top:0;margin:0 auto;
    width:clamp(220px,26vw,340px);opacity:.24;pointer-events:none;z-index:0}
  .thoughts .mid h2{position:relative;z-index:1;font-size:clamp(26px,3.6vw,38px);font-weight:900;
    letter-spacing:-.03em;color:#12b39a;margin:0 0 22px}
  .thoughts .mid p{position:relative;z-index:1;margin:0 0 22px;font-size:16px;line-height:1.8;color:#5b6591}
  .thoughts .mid .btn{position:relative;z-index:1;background:#16225c;color:#fff;border:0;border-radius:12px;
    padding:15px 30px;font-size:15.5px;box-shadow:none}
  .thoughts .mid .btn:hover{filter:brightness(1.15);transform:translateY(-1px)}

  /* 3. 한마디 */
  .voices{background:linear-gradient(180deg,#fff6f9 0%,#f3f2fd 100%);padding:64px 0 70px;text-align:center}
  .voices .eyebrow{font-size:24px;font-weight:900;color:var(--brand);margin-bottom:16px}
  .voices h2{font-size:clamp(26px,4vw,46px);font-weight:900;letter-spacing:-.04em;line-height:1.25;margin:0 0 34px}
  .voices h2 em{font-style:normal;color:#7b2ff2}
  .voice-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:26px;align-items:center;max-width:1400px;margin:0 auto}
  .voice-col{display:flex;flex-direction:column;gap:16px}
  .voice-col.l{align-items:flex-end}
  .voice-col.r{align-items:flex-start}
  .voice{background:#fff;border:2px solid #cfe9de;border-radius:34px;padding:20px 30px;text-align:left;
    font-size:clamp(15px,1.6vw,21px);font-weight:700;line-height:1.55;color:#16225c;word-break:keep-all;max-width:560px}
  .voice-col.r .voice{border-color:#f6cdd9}
  .voice-mid img{display:block;width:clamp(150px,22vw,300px);max-width:100%;
    filter:drop-shadow(0 20px 30px rgba(28,38,90,.2));animation:floaty 5.6s ease-in-out infinite}

  /* 4. 우리가 하는 일 */
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 26px;flex-wrap:wrap}
  .pill-label{display:inline-flex;color:var(--brand);background:var(--brand-weak);font-size:13.5px;
    font-weight:800;padding:6px 12px;border-radius:999px;margin-bottom:12px}
  .sec-head h2{font-size:clamp(24px,3.2vw,34px);font-weight:900;letter-spacing:-.03em;margin:0}
  .btn.softpink{background:var(--brand-weak);color:var(--brand);border:0;border-radius:14px;padding:12px 18px;box-shadow:none}
  .work-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .work{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:22px;padding:26px;
    box-shadow:0 14px 40px rgba(28,38,90,.11)}
  .work .n{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;
    font-size:21px;font-weight:900;margin-bottom:16px}
  .work h3{margin:0 0 10px;font-size:clamp(20px,2.2vw,27px);font-weight:900;letter-spacing:-.03em;word-break:keep-all}
  .work p{margin:0;font-size:clamp(14px,1.4vw,19px);line-height:1.7;color:var(--muted);word-break:keep-all}

  /* 연혁 — 배경 없이 페이지에 그대로 얹습니다 */
  .history{background:transparent;padding:0;text-align:center}
  .history .lead-line{margin:12px auto 22px;max-width:44em;font-size:15.5px;
    color:var(--muted);line-height:1.8;word-break:keep-all}
  /* 배경을 지운 PNG라 그대로 얹힙니다. 다만 다크 모드에서는 그림 속
     짙은 남색 글씨가 묻히므로 그때만 흰 판을 받칩니다. */
  .histfig{margin:0 auto;max-width:540px;line-height:0;background:transparent}
  @media (prefers-color-scheme:dark){
    .histfig{background:#fff;border-radius:16px;overflow:hidden;padding:6px}
  }
  .histfig img{display:block;width:100%;height:auto}
  .history figcaption{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.6}

  /* 6. 소식 카드 */
  .news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .news-card{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
  .news-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  /* flex:0 0 auto — 카드 높이가 늘어나도 사진이 따라 늘어나지 않습니다.
     min-height:0 + overflow:hidden — 사진 원본 높이가 16:10 비율을 밀어내지 못하게 합니다 */
  .news-card .ph{aspect-ratio:16/10;background:linear-gradient(150deg,#f3f2fd,#fff9ec);display:grid;
    place-items:center;color:#a2a9c6;font-size:28px;flex:0 0 auto;overflow:hidden;min-height:0}
  .news-card .ph img{width:100%;height:100%;object-fit:cover;display:block;min-width:0;min-height:0}
  .news-card .bd{padding:18px 22px 22px;flex:1 1 auto}
  .news-card h3{margin:10px 0 8px;font-size:clamp(17px,1.8vw,23px);font-weight:900;letter-spacing:-.03em;
    line-height:1.35;word-break:keep-all}
  .news-card p{margin:0 0 12px;font-size:14px;color:var(--muted);line-height:1.6;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-card .dt{font-size:12.5px;color:var(--muted)}

  /* 7·8. 일정 캘린더 + 게임 배너 — 같은 폭으로 위아래 배치 */
  /* 캘린더(왼쪽) + 게임 배너(오른쪽) 나란히 */
  .home-stack{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .schedcard{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:28px;
    box-shadow:var(--shadow);padding:30px 34px}
  .schedcard h2{font-size:clamp(20px,2.4vw,26px);font-weight:900;letter-spacing:-.03em;margin:0}
  .sched-head{display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .cal-month{font-size:17px;font-weight:900;color:var(--brand)}
  .home-cal .day{min-height:74px;cursor:default}
  .home-cal .day:hover{background:var(--surface)}
  .home-cal .day.dim:hover{background:var(--surface)}
  .sched-row{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--border)}
  .sched-row:last-of-type{border-bottom:0}
  .sched-row .d{flex:none;background:#f0eeff;color:#4a3ec8;font-weight:900;font-size:14px;
    padding:9px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
  .sched-row b{display:block;font-size:15px;font-weight:800}
  .sched-row span{font-size:13px;color:var(--muted)}
  .linkmore{border:0;background:transparent;color:var(--brand);font-weight:800;font-size:14px;
    cursor:pointer;padding:14px 0 0;font-family:inherit}

  /* 8. 게임 배너 — 일러스트로 꽉 채웁니다 */
  .gamebanner{display:block;width:100%;padding:0;border:0;background:#f9d9e4;border-radius:26px;
    overflow:hidden;cursor:pointer;position:relative;line-height:0;
    box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s}
  .gamebanner:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  /* 그림이 배너를 꽉 채우되 말풍선·캐릭터가 잘리지 않도록 위쪽을 살려 자릅니다 */
  /* 원본을 자르지 않고 전체를 보여줍니다 */
  .gamebanner img{display:block;width:100%;height:auto}
  .gb-cta{position:absolute;right:22px;bottom:20px;background:var(--brand);color:#fff;
    font-family:inherit;font-size:14.5px;font-weight:800;padding:11px 20px;border-radius:999px;
    line-height:1;box-shadow:0 8px 22px rgba(214,30,92,.3)}

  @media (prefers-reduced-motion:reduce){ .hero-art img,.voice-mid img{animation:none} }

  /* ════════════ 속화면 공통 (디자인 시안) ════════════ */
  .crumb{font-size:13px;color:#a2a9c6;margin-bottom:18px}
  .pg-title{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.03em;margin:0 0 8px}
  .pg-sub{margin:0 0 26px;color:var(--muted);font-size:14.5px;word-break:keep-all}
  .pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}

  /* 소개 — 팀 밴드 */
  .teamband{padding:30px clamp(18px,3vw,40px);display:grid;grid-template-columns:auto minmax(0,1fr);
    gap:clamp(20px,3vw,42px);align-items:center}
  .teamband:nth-child(even){grid-template-columns:minmax(0,1fr) auto;text-align:right}
  .teamband:nth-child(even) .tb-art{order:2}
  /* 네모 틀 — 사진을 자르지 않고 원본 그대로 보여줍니다 */
  .tb-art{width:clamp(190px,27vw,340px);border-radius:20px;overflow:hidden;line-height:0}
  .tb-art img{width:100%;height:auto;display:block}
  .tb-art.ph{aspect-ratio:1;background:rgba(255,255,255,.62);border:2px dashed rgba(22,34,92,.16);
    display:grid;place-items:center;text-align:center;color:rgba(22,34,92,.4);
    font-size:13px;font-weight:700;line-height:1.5}
  .tb-no{font-size:13.5px;font-weight:900;letter-spacing:.14em;color:var(--brand);margin-bottom:10px}
  .teamband h3{font-size:clamp(28px,3.9vw,44px);font-weight:900;letter-spacing:-.03em;margin:0 0 14px}
  .teamband .lead{font-size:clamp(17px,2.1vw,24px);font-weight:800;margin:0 0 10px;color:var(--text)}
  .teamband p{margin:0;font-size:clamp(15px,1.7vw,19px);color:var(--muted);line-height:1.7;word-break:keep-all}


  /* 소식 — 추천 + 목록 */
  .news-feat{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
  .feat-card{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:24px;
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
  .feat-card .ph{aspect-ratio:16/10;background:linear-gradient(150deg,#f3f2fd,#fff9ec);
    display:grid;place-items:center;color:#a2a9c6;font-size:13px}
  .feat-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .feat-card .bd{padding:22px 26px 26px}
  .feat-card h3{margin:10px 0 8px;font-size:clamp(19px,2.2vw,26px);font-weight:900;letter-spacing:-.03em}
  .feat-card p{margin:0 0 12px;font-size:14px;color:var(--muted);word-break:keep-all}
  .side-list{display:flex;flex-direction:column;gap:14px}
  .side-item{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:20px;
    box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:14px;
    align-items:center;cursor:pointer}
  .side-item .ph{width:88px;height:66px;border-radius:14px;background:linear-gradient(150deg,#f3f2fd,#fff9ec);
    display:grid;place-items:center;color:#a2a9c6;font-size:11px;overflow:hidden;flex:none}
  .side-item .ph img{width:100%;height:100%;object-fit:cover}
  .side-item h4{margin:6px 0 4px;font-size:15.5px;font-weight:900;letter-spacing:-.02em;line-height:1.35;word-break:keep-all}
  .side-item .dt{font-size:12px;color:var(--muted)}

  /* 의견함 — 표 */
  .filter-pills{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
  .fpill{border:0;background:var(--surface-2);color:var(--muted);font-family:inherit;font-size:13.5px;
    font-weight:800;padding:9px 18px;border-radius:999px;cursor:pointer}
  .fpill.on{background:var(--brand);color:#fff}
  .op-table{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:22px;
    box-shadow:var(--shadow);overflow:hidden}
  .op-table table{font-size:13.5px}
  .op-table th{background:var(--surface-2);padding:14px 18px;font-size:12px;text-transform:none;font-weight:800}
  .op-table td{padding:16px 18px}
  .op-table tbody tr{cursor:pointer}
  .op-table .no{color:var(--muted);font-weight:800;width:56px}
  .op-table .subj b{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
  .op-table .subj span{font-size:12px;color:var(--muted)}

  /* 일정 — 캘린더 + 사이드 */
  .cal-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
  .cal-panel{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:24px;
    box-shadow:var(--shadow);padding:24px 26px}
  .cal-side{display:flex;flex-direction:column;gap:16px}
  .attend{background:linear-gradient(160deg,#ffe1ec,#e9e5ff);border-radius:24px;padding:26px;text-align:center}
  .attend b{display:block;font-size:44px;font-weight:900;letter-spacing:-.04em;margin:8px 0}
  .attend p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.6}
  .attend img{width:clamp(110px,14vw,150px);animation:floaty 5.6s ease-in-out infinite}

  /* 공간 — 사진 카드 */
  .space-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .space-card{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:22px;
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer}
  .space-card .ph{aspect-ratio:4/3;display:grid;place-items:center;color:#a2a9c6;font-size:12.5px}
  .space-card .ph img{width:100%;height:100%;object-fit:cover}
  .space-card .bd{padding:16px 20px 18px;flex:1;display:flex;flex-direction:column}
  .space-card p{margin:0 0 12px;font-size:14.5px;font-weight:800;line-height:1.55;word-break:keep-all;flex:1}
  .space-card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .loginbar{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:20px;
    box-shadow:var(--shadow);padding:18px 22px;display:flex;align-items:center;gap:16px;
    flex-wrap:wrap;margin-bottom:22px;font-size:14px;font-weight:700}

  /* 게임 */
  .game-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
  .quizcard{background:var(--surface);border:1px solid rgba(22,34,92,.06);border-radius:24px;
    box-shadow:var(--shadow);padding:26px 28px}
  .quizcard h3{margin:12px 0 20px;font-size:clamp(16px,1.9vw,20px);font-weight:900;line-height:1.5;word-break:keep-all}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-family:inherit;font-size:14.5px;font-weight:700;padding:14px 18px;
    border-radius:14px;cursor:pointer;margin-bottom:10px}
  .choice:hover{border-color:var(--brand);background:var(--brand-weak)}
  .choice.ok{border-color:var(--ok);background:var(--ok-weak);color:var(--ok)}
  .choice.no{border-color:var(--danger);background:var(--danger-weak);color:var(--danger)}
  .quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px}
  .gamepanel{background:linear-gradient(160deg,#ffe1ec,#e9e5ff);border-radius:24px;padding:26px;text-align:center}
  .gamepanel .bars{display:flex;gap:8px;justify-content:center;margin:14px 0 18px}
  .gamepanel .bars i{width:44px;height:7px;border-radius:999px;background:rgba(255,255,255,.6)}
  .gamepanel .bars i.on{background:var(--brand)}
  .gamepanel img{width:clamp(130px,18vw,210px)}

  @media (max-width:860px){
    .teamband,.teamband:nth-child(even){grid-template-columns:minmax(0,1fr);text-align:left;gap:20px;padding:30px 22px}
    .teamband:nth-child(even) .tb-art{order:0}
    .news-feat,.cal-layout,.game-layout{grid-template-columns:minmax(0,1fr)}
    .space-grid{grid-template-columns:minmax(0,1fr)}
  }

  .topbar{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}
  @media (max-width:960px){
    .navtoggle{display:block}
    .brandbtn .wordmark{display:none}
    /* .topnav 의 backdrop-filter 가 자식인 .mainnav(position:fixed)를
       화면 전체가 아니라 헤더 자기 높이 안에 가둬버려서(스펙상 필터가
       고정요소의 containing block이 됨) 꺼둡니다 — 모바일 메뉴가
       열렸을 때 헤더 높이(약 70px)로 짓눌려 보이던 원인이었습니다. */
    .topnav{backdrop-filter:none;-webkit-backdrop-filter:none}
    .mainnav{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--surface);z-index:40;
      flex-direction:column;align-items:stretch;gap:4px;padding:72px 18px 24px;overflow-y:auto;
      transform:translateX(100%);transition:transform .25s;flex-wrap:nowrap}
    .mainnav.open{transform:translateX(0)}
    .mainnav .nav-btn{text-align:left;font-size:16px;padding:13px 16px}
    .navdrop{position:static}
    .navdrop-panel{position:static;display:block;border:0;box-shadow:none;padding:0;background:transparent;min-width:0}
    .navdrop>.nav-btn{display:none}
    .scrim.open{display:block}
  }
  @media (max-width:860px){
    .stat-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .grid.c2,.grid.c3{grid-template-columns:minmax(0,1fr)}
    .hero{padding:32px 0 38px}
    .hero-in{grid-template-columns:minmax(0,1fr);gap:22px}
    .hero-art{min-height:240px;order:-1}
    .hero-art img{width:min(92%,330px);margin-right:0}
    .bubble{font-size:12px;padding:9px 13px}
    .bubble.r{bottom:20px;right:0}
    .thoughts{padding:26px 18px 32px;border-radius:22px}
    .thought{font-size:15px !important;padding:14px 18px !important}
    .thoughts .mid{padding-top:90px}
    /* 활동 영역은 모바일에서도 2행 3열을 유지합니다 */
    .home-stack{grid-template-columns:minmax(0,1fr);gap:18px}
    .work-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .work{padding:14px 12px;border-radius:16px}
    .work .n{width:38px;height:38px;border-radius:11px;font-size:14px;margin-bottom:9px}
    .work h3{font-size:15px;margin:0 0 6px;letter-spacing:-.04em}
    .work p{font-size:12px;line-height:1.55}
    /* 소식은 모바일에서도 2열로 배치합니다(6건이면 3행 2열) */
    .news-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .news-card{border-radius:16px}
    /* 칸이 좁으므로 사진을 4:3으로 세워 더 많이 보이게 합니다 */
    .news-card .ph{aspect-ratio:4/3}
    .news-card .bd{padding:12px 13px 15px}
    .news-card h3{font-size:15px;margin:8px 0 6px;line-height:1.32}
    .news-card p{font-size:12.5px;line-height:1.55;margin:0 0 9px}
    .news-card .dt{font-size:11.5px}
    .news-card .tag{font-size:11px;padding:3px 9px}
    .voice-grid{grid-template-columns:minmax(0,1fr);gap:16px}
    .voice-col.l,.voice-col.r{align-items:stretch}
    .voice-mid{order:-1;display:flex;justify-content:center}
    .voice{font-size:15px;padding:16px 20px;max-width:none}
    .gamebanner{border-radius:20px}
    .gb-cta{right:12px;bottom:12px;font-size:12.5px;padding:9px 15px}
    .schedcard{padding:22px 20px}
    .cal .day{min-height:64px}
    .cal .ev{font-size:11px}

    /* 손가락으로 누르는 화면 — 터치 영역을 최소 44px로 키웁니다 */
    .topnav .btn.sm,.brandbtn,.linkmore,.navtoggle,.btn.sm{min-height:44px}
    .topnav .btn.sm{padding:11px 16px}
    .brandbtn{padding:6px 4px}
    .linkmore{padding:10px 2px}
  }

  /* 달력 칸이 좁으면 일정 제목을 읽을 수 없으므로 점으로 표시합니다.
     날짜를 누르면 아래 패널에 제목이 나옵니다(제목은 title 속성으로도 남아 있습니다). */
  @media (max-width:1200px){
    .cal .ev{width:6px;height:6px;padding:0;border-radius:50%;background:var(--brand);
      font-size:0;line-height:0;overflow:hidden;margin:1px 0 0 1px;flex:0 0 auto}
    .cal .day{gap:2px}
  }

  /* 손가락으로 조작하는 기기(태블릿 가로 포함) — 폭과 무관하게 터치 영역 확보 */
  @media (pointer:coarse){

<script>
/* ============================================================

/* ---------- storage (localStorage가 막힌 환경에서는 메모리 대체) ---------- */
const MEM = {};
let STORE_OK = true;
try{ localStorage.setItem('sm_probe','1'); localStorage.removeItem('sm_probe'); }catch(e){ STORE_OK = false; }
const LS = {
  get(k, def){
    try{
      const raw = STORE_OK ? localStorage.getItem(k) : (MEM[k] ?? null);
      return raw==null ? def : (JSON.parse(raw) ?? def);
    }catch(e){ return def }
  },
  set(k, v){
    const raw = JSON.stringify(v);
    if(!STORE_OK){ MEM[k] = raw; return true; }
    try{ localStorage.setItem(k, raw); return true; }
    catch(e){
      toast('저장 공간이 가득 찼습니다. 사진을 줄이거나 백업 후 오래된 글을 정리하세요.');
      return false;
    }
  },
  del(k){ if(STORE_OK){ try{ localStorage.removeItem(k) }catch(e){} } delete MEM[k]; }
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const pad = (n) => String(n).padStart(2,'0');
const fmt = (iso) => { if(!iso) return '-'; const d=new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDay = (iso) => iso ? new Date(iso).toISOString().slice(0,10) : '-';
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const won = (n) => (Number(n)||0).toLocaleString('ko-KR') + '원';
const esc = (s) => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const excerpt = (s,n=120) => { const t=String(s||'').replace(/\s+/g,' ').trim(); return t.length>n ? t.slice(0,n)+'…' : t; };
const firstImg = (atts) => (atts||[]).find(a=>a.data && a.type?.startsWith('image/'));

/* ---------- data ---------- */
const DEFAULT_INTRO = {

/* ---------- session ---------- */

   서버를 붙이면 이 키를 IP 해시로 바꾸기만 하면 동일하게 동작합니다. */
function myAlias(){
  let key = LS.get('sm_visitor', null);
  if(!key){ key = uid(); LS.set('sm_visitor', key); }
  const map = LS.get('sm_aliasmap', {});
  if(!map[key]){ map[key] = Object.keys(map).length + 1; LS.set('sm_aliasmap', map); }
  return '새소리' + map[key];
}

const can = (id) => { const m = MENUS.find(x=>x.id===id); return !!m && m.roles.includes(SESSION?.role); };

/* ============================================================
   LOGIN
   ============================================================ */
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));


const isSignedIn = () => SESSION && SESSION.role !== 'anon';

function paintWho(){
  /* 시안대로: 로그인 전에는 "단원 로그인" 버튼만 */
  if(isSignedIn()){
    $('#whoBox').innerHTML = `${esc(SESSION.name)}<em>${ROLE_LABEL[SESSION.role]}</em>`;
    $('#whoBox').style.display = '';
    $('#logoutBtn').textContent = '로그아웃';
    $('#logoutBtn').className = 'btn sm';
  }else{
    $('#whoBox').style.display = 'none';
    $('#logoutBtn').textContent = '단원 로그인';
    $('#logoutBtn').className = 'btn primary sm';
  }
}

function enterApp(){

  $('#appView').style.display='block';
  renderNav();
  paintWho();
  const start = location.hash.replace('#','') || 'home';
  go(can(start) ? start : 'home');
}

/* 로그인은 전체 화면이 아니라 모달로 (시안 구조) */
function openLogin(){
  const s = DB.settings();
  openModal('단원 로그인', `
    <p class="hint" style="margin:0 0 16px">연습용 사본입니다. 접근 코드로 권한을 골라 들어갑니다.</p>

    <label class="field">표시 이름 <span class="req">*</span><input id="lgName" placeholder="예) 홍길동"></label>
    <label class="field">접근 코드 <span class="req">*</span>
      <input id="lgCode" type="password" placeholder="담당자에게 받은 코드">
      <span class="hint">기본값 — 단원 <code>${esc(s.codeMember)}</code> ·
        담당관 <code>${esc(s.codeOfficer)}</code> · 관리자 <code>${esc(s.codeAdmin)}</code></span></label>
    <div class="row-actions"><button class="btn primary" id="lgGo" style="width:100%">로그인</button></div>`);

  const submit = ()=>{
    const role = $('#lgRole').value, name = $('#lgName').value.trim(), code = $('#lgCode').value;
    if(!name){ toast('표시 이름을 입력하세요'); return; }
    const st = DB.settings();
    const want = role==='member' ? st.codeMember : role==='officer' ? st.codeOfficer : st.codeAdmin;
    if(code !== want){ toast('접근 코드가 올바르지 않습니다'); return; }

    LS.set('sm_session', SESSION);
    closeModal(); renderNav(); paintWho(); go('home');
    toast(`${name}님, 환영합니다`);
  };
  $('#lgGo').addEventListener('click', submit);
  ['#lgName','#lgCode'].forEach(x=> $(x).addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
}

const PUBLIC_NAV = ['intro','news','opinion','calendar','share','game'];

function renderNav(){
  const mine = MENUS.filter(m => m.roles.includes(SESSION.role));
  const top  = PUBLIC_NAV.map(id => mine.find(m => m.id===id)).filter(Boolean);
  const rest = mine.filter(m => !PUBLIC_NAV.includes(m.id) && m.id!=='home');

  let html = top.map(m => `<button class="nav-btn" data-go="${m.id}">${esc(m.label)}</button>`).join('');

  if(rest.length){
    const groups = {};
    rest.forEach(m => (groups[m.group] = groups[m.group]||[]).push(m));
    html += `<div class="navdrop" id="navDrop">
      <button class="nav-btn" id="navDropBtn">단원 메뉴 ▾</button>
      <div class="navdrop-panel">
        ${Object.entries(groups).map(([g,items]) =>
          `<div class="grp">${esc(g)}</div>` +
          items.map(m=>`<button class="nav-btn" data-go="${m.id}">${m.icon} ${esc(m.label)}</button>`).join('')
        ).join('')}
      </div></div>`;
  }

  $('#navArea').innerHTML = html;
  $$('#navArea .nav-btn[data-go]').forEach(b =>
    b.addEventListener('click', ()=>{ go(b.dataset.go); closeSide(); }));
  $('#navDropBtn')?.addEventListener('click', e=>{
    e.stopPropagation(); $('#navDrop').classList.toggle('open'); });
}
document.addEventListener('click', ()=> $('#navDrop')?.classList.remove('open'));

function setActive(id){
  $$('#navArea .nav-btn[data-go]').forEach(b => b.classList.toggle('active', b.dataset.go===id));
  const inDrop = !!document.querySelector(`.navdrop-panel .nav-btn[data-go="${id}"]`);
  $('#navDropBtn')?.classList.toggle('active', inDrop);
}
let CURRENT = 'home';
function go(id){
  if(!can(id)) id = 'home';
  CURRENT = id;
  try{ location.hash = id }catch(e){}
  setActive(id);
  $('#main').innerHTML = (VIEWS[id] || VIEWS.home)();
  if(BIND[id]) BIND[id]();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', ()=>{
  if(!SESSION) return;
  const id = location.hash.replace('#','');
  if(id && id!==CURRENT) go(id);
});

function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const rx = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return safe.replace(rx, '<mark>$1</mark>');
}
function searchBar(viewId, placeholder){
  const q = Q[viewId] || '';
  return `<div class="searchbar">
    <input id="sq_${viewId}" value="${esc(q)}" placeholder="${esc(placeholder)}">

    ${q?`<button class="btn ghost" id="sc_${viewId}">초기화</button>`:''}

function bindSearch(viewId){
  const inp = $('#sq_'+viewId);
  const run = ()=>{ Q[viewId] = inp.value.trim(); go(viewId); };
  $('#sb_'+viewId).addEventListener('click', run);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  $('#sc_'+viewId)?.addEventListener('click', ()=>{ Q[viewId]=''; go(viewId); });
  if(Q[viewId]){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

/* 홈 캘린더 — 이번 달을 읽기 전용으로 보여줍니다 */
const HM = { y:new Date().getFullYear(), m:new Date().getMonth() };
function homeCalendar(){
  const startDow = new Date(HM.y, HM.m, 1).getDay();
  const daysInMonth = new Date(HM.y, HM.m+1, 0).getDate();
  const prevDays = new Date(HM.y, HM.m, 0).getDate();
  const today = ymd(new Date());

  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({ d:prevDays-i, dim:true, key:null });
  for(let d=1;d<=daysInMonth;d++) cells.push({ d, dim:false, key:`${HM.y}-${pad(HM.m+1)}-${pad(d)}` });
  let tail = 1; while(cells.length % 7 !== 0) cells.push({ d:tail++, dim:true, key:null });

  return `<div class="cal home-cal">
    ${['일','월','화','수','목','금','토'].map(w=>`<div class="dow">${w}</div>`).join('')}
    ${cells.map((c,i)=>{
      const evs = c.key ? DB.events().filter(e=>e.date===c.key) : [];
      const cls = ['day', c.dim?'dim':'', c.key===today?'today':'', i%7===0?'sun':''].filter(Boolean).join(' ');
      return `<div class="${cls}">
        <span class="dnum">${c.d}</span>
        ${evs.slice(0,2).map(e=>`<span class="ev" title="${esc(e.title)}${e.place?' · '+esc(e.place):''}">${esc(e.title)}</span>`).join('')}
        ${evs.length>2?`<span class="hint" style="margin:0">+${evs.length-2}</span>`:''}</div>`;
    }).join('')}</div>`;
}

function boardView(key){
  const b = BOARDS[key];

  let list = DB.posts().filter(p => p.board===key);
  if(q) list = list.filter(p => (p.title+' '+p.body+' '+p.author).toLowerCase().includes(q));
  list.sort((a,b2)=> (b2.pinned?1:0)-(a.pinned?1:0) || b2.at.localeCompare(a.at));

  const writeBtn = canWrite(key) ? `<button class="btn primary" id="bdWrite">✏️ 글쓰기</button>` : '';
  let body = '';

  if(!list.length){
    body = `<div class="empty">${q ? `“${esc(Q[key])}” 검색 결과가 없습니다.` : '아직 등록된 글이 없습니다.'}</div>`;
  } else if(b.layout==='photo'){
    body = `<div class="photo-grid">${list.map(p=>{
      const img = firstImg(p.atts);
      return `<article class="photo-card" data-open-post="${p.id}">
        ${img ? `<img class="hero" src="${img.data}" alt="">`
              : `<div class="hero none">${b.icon}</div>`}
        <div class="pc-body">
          <h3>${p.pinned?'<span class="tag brand">공지</span> ':''}${highlight(p.title,Q[key])}</h3>
          <p class="excerpt">${highlight(excerpt(p.body,90),Q[key])}</p>
          <div class="meta"><span>${esc(p.author)}</span><span>${fmtDay(p.at)}${(p.atts||[]).length?' · 📎'+p.atts.length:''}</span></div>
        </div></article>`;
    }).join('')}</div>`;
  } else {
    body = `<div class="card">${list.map(p=>`
      <div class="post-row" data-open-post="${p.id}">
        <div class="pr-top">
          <h3>${p.pinned?'<span class="tag brand">공지</span> ':''}${highlight(p.title,Q[key])}${(p.atts||[]).length?' <span class="hint">📎'+p.atts.length+'</span>':''}</h3>
          <span class="hint">${fmtDay(p.at)}</span>
        </div>
        <p class="excerpt">${highlight(excerpt(p.body,110),Q[key])} <span class="hint">· ${esc(p.author)}</span></p>
      </div>`).join('')}</div>`;
  }

  return pageHead(b.label, b.desc, writeBtn)
    + searchBar(key, '제목·내용·작성자로 검색')
    + (q ? `<div class="search-info">“${esc(Q[key])}” 검색 결과 ${list.length}건</div>` : '')
    + body;

function openPostForm(key){
  const b = BOARDS[key];
  const photo = b.layout==='photo';
  openModal(`${b.icon} ${b.label} · 글쓰기`, `
    <label class="field">제목 <span class="req">*</span><input id="pfTitle" placeholder="제목을 입력하세요"></label>
    <label class="field">내용 <span class="req">*</span><textarea id="pfBody" style="min-height:150px"></textarea></label>
    <label class="field">사진 / 첨부${photo?' <span class="req">*</span>':' <span class="hint" style="display:inline">선택</span>'}
      <input id="pfFiles" type="file" multiple accept="${photo?'image/*':'image/*,.pdf,.doc,.docx,.hwp,.xlsx'}">
      <span class="hint">${photo?'첫 번째 사진이 목록에서 크게 표시됩니다. 사진은 자동 축소 저장됩니다.':'이미지는 자동 축소, 5MB 초과 문서는 파일명만 기록됩니다.'}</span>
    </label>
    <div class="thumbs" id="pfThumbs"></div>
    ${['officer','admin'].includes(SESSION.role)
      ? `<label class="field" style="display:flex;align-items:center;gap:8px">
           <input type="checkbox" id="pfPin" style="width:auto;margin:0"> 상단 고정(공지)</label>` : ''}
    <div class="row-actions"><button class="btn primary" id="pfSave">등록</button></div>`);

  let atts = [];
  $('#pfFiles').addEventListener('change', async e=>{
    atts = await collectFiles(e.target.files);
    renderThumbs('#pfThumbs', atts);
  });
  $('#pfSave').addEventListener('click', ()=>{
    const title = $('#pfTitle').value.trim(), body = $('#pfBody').value.trim();
    if(!title || !body){ toast('제목과 내용을 입력하세요'); return; }
    if(photo && !atts.some(a=>a.type?.startsWith('image/'))){ toast('사진을 1장 이상 첨부하세요'); return; }
    const arr = DB.posts();
    arr.push({ id:uid(), board:key, title, body, atts,
               author:SESSION.name, authorRole:SESSION.role,
               pinned: !!$('#pfPin')?.checked, at:nowISO() });
    if(DB.savePosts(arr)){ closeModal(); toast('등록되었습니다'); go(key); }
  });
}

/* ---------- 글 상세 ---------- */
function openPost(id){
  const p = DB.posts().find(x=>x.id===id); if(!p) return;
  const imgs = (p.atts||[]).filter(a=>a.data && a.type?.startsWith('image/'));
  const docs = (p.atts||[]).filter(a=>!a.type?.startsWith('image/'));
  const mine = p.author===SESSION.name || SESSION.role==='admin';
  openModal(p.title, `
    <div class="hint" style="margin-bottom:14px">
      ${esc(p.author)} · ${fmt(p.at)} · ${esc(BOARDS[p.board]?.label||'')}
    </div>
    ${imgs.length ? `<div class="big-imgs">${imgs.map(a=>`<img src="${a.data}" alt="${esc(a.name)}" data-zoom="${a.data}">`).join('')}</div>` : ''}
    <div style="white-space:pre-wrap;font-size:14.5px;margin-top:6px">${esc(p.body)}</div>
    ${docs.length ? `<div class="thumbs" style="margin-top:14px">${docs.map(a=>`<span class="tag recv">📄 ${esc(a.name)}</span>`).join('')}</div>` : ''}
    ${mine ? `<div class="row-actions" style="margin-top:18px"><button class="btn sm danger" id="ppDel">글 삭제</button></div>` : ''}`);
  $$('#modalBody [data-zoom]').forEach(im => im.addEventListener('click', ()=> lightbox(im.dataset.zoom)));
  $('#ppDel')?.addEventListener('click', ()=>{
    if(!confirm('이 글을 삭제할까요? 되돌릴 수 없습니다.')) return;
    DB.savePosts(DB.posts().filter(x=>x.id!==id));
    closeModal(); toast('삭제되었습니다'); go(CURRENT);
  });
}

   4) 의견함 (익명 별칭 + 댓글 + 검색)

const myOps   = () => LS.get('sm_myops', []);
const isMine  = (id) => myOps().includes(id);
const addMyOp = (id) => { const a = myOps(); a.push(id); LS.set('sm_myops', a); };
const dropMyOp= (id) => LS.set('sm_myops', myOps().filter(x=>x!==id));
function hashPin(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0 } return h.toString(36); }

/* 의견 분류 — 여기만 고치면 작성 폼에 그대로 반영됩니다 */
const OP_CATS = ['일하는 방식','조직문화','업무효율','디지털·AI','복지·근무환경','제도개선','기타'];

VIEWS.opinion = () => {
  const q = (Q.opinion||'').toLowerCase();
  let list = DB.opinions().slice().sort((a,b)=>b.at.localeCompare(a.at));
  if(q) list = list.filter(o =>
    (o.body + ' ' + o.cat + ' ' + o.alias + ' ' + (o.comments||[]).map(c=>c.body).join(' ')).toLowerCase().includes(q));
  const isAdmin = SESSION.role==='admin';

  return pageHead('의견함', '누구나 익명으로 의견을 남기고 댓글을 달 수 있습니다. 작성한 글은 방문자 모두에게 공개됩니다.')
  + `<div class="notice">현재 내 별칭은 <b>${esc(myAlias())}</b> 입니다.
      이름·소속·연락처는 저장하지 않으며, 같은 기기에서는 항상 같은 별칭이 표시됩니다.</div>
    <div class="card">
      <h2>새 의견 남기기</h2>
      <p class="sub">답변이 필요하면 본문에 연락 방법을 직접 적어주세요.</p>
      <label class="field">분류
        <select id="opCat">${OP_CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      </label>
      <label class="field">내용 <span class="req">*</span><textarea id="opBody" placeholder="자유롭게 작성해주세요"></textarea></label>
      <label class="field">삭제 비밀번호 <span class="hint" style="display:inline">선택</span>
        <input id="opPin" type="password" maxlength="20" placeholder="다른 기기에서도 지우려면 입력">
        <span class="hint">이 기기에서 쓴 글은 비밀번호 없이 바로 지울 수 있습니다. 휴대폰 등 다른 기기에서 지울 일이 있으면 정해두세요.</span>
      </label>
      <div class="row-actions"><button class="btn primary" id="opSubmit">익명으로 제출</button></div>
    </div>`
  + searchBar('opinion','의견 내용·별칭·댓글로 검색')
  + (q ? `<div class="search-info">“${esc(Q.opinion)}” 검색 결과 ${list.length}건</div>` : '')
  + `<div class="card" style="background:transparent;border:0;box-shadow:none;padding:0">
      <h2 style="margin-bottom:12px">접수된 의견 (${list.length})</h2>
      ${list.length ? list.map(o=>{
        const mine = isMine(o.id);
        let btns = '';
        if(mine)       btns += `<button class="btn sm danger" data-del="${o.id}">내 글 삭제</button>`;
        else if(o.pin) btns += `<button class="btn sm danger" data-del="${o.id}">비밀번호로 삭제</button>`;
        if(isAdmin)    btns += `<button class="btn sm danger" data-admindel="${o.id}">관리자 삭제</button>`;
        const cmts = o.comments || [];
        return `<div class="op-item">
          <div class="op-head">
            <div><span class="tag brand">${esc(o.cat)}</span>
              <b style="margin-left:8px;font-size:13.5px">${esc(o.alias||'익명')}</b>
              ${mine?'<span class="tag approve" style="margin-left:6px">내 글</span>':''}</div>
            <span class="hint">${fmt(o.at)}</span>
          </div>
          <div class="op-body">${highlight(o.body, Q.opinion)}</div>
          ${btns?`<div class="row-actions">${btns}</div>`:''}
          <div class="cmt-list">
            ${cmts.length ? cmts.map(c=>{
              const cm = isMine(c.id);
              return `<div class="cmt">
                <div class="cm-meta"><b>${esc(c.alias)}</b><span>${fmt(c.at)}</span>
                  ${(cm||isAdmin)?`<button class="btn sm ghost" style="padding:2px 7px;font-size:11px"
                      data-cdel="${o.id}:${c.id}">삭제</button>`:''}</div>
                <div>${highlight(c.body, Q.opinion)}</div></div>`;
            }).join('') : `<div class="hint" style="margin:0">아직 댓글이 없습니다.</div>`}
            <div class="cmt-form">
              <input data-cinput="${o.id}" placeholder="${esc(myAlias())}(으)로 댓글 남기기">
              <button class="btn sm" data-cadd="${o.id}">등록</button>
            </div>
          </div>
        </div>`;
      }).join('') : `<div class="empty">${q?'검색 결과가 없습니다.':'아직 접수된 의견이 없습니다.'}</div>`}
    </div>`;
};
BIND.opinion = () => {
  bindSearch('opinion');

  $('#opSubmit').addEventListener('click', ()=>{
    const body = $('#opBody').value.trim();
    if(!body){ toast('내용을 입력하세요'); return; }
    const pin = $('#opPin').value;
    const id = uid();
    const arr = DB.opinions();
    arr.push({ id, cat:$('#opCat').value, body, alias:myAlias(), at:nowISO(),
               pin: pin ? hashPin(pin) : '', comments:[] });
    if(DB.saveOpinions(arr)){ addMyOp(id); toast('익명으로 제출되었습니다'); go('opinion'); }
  });

  // 의견 삭제 (본인 / 비밀번호)
  $$('#main [data-del]').forEach(b => b.addEventListener('click', ()=>{
    const id = b.dataset.del;
    const o = DB.opinions().find(x=>x.id===id); if(!o) return;
    if(!isMine(id)){
      const pin = prompt('작성 시 정한 삭제 비밀번호를 입력하세요');
      if(pin===null) return;
      if(!o.pin || hashPin(pin)!==o.pin){ toast('비밀번호가 일치하지 않습니다'); return; }
    }
    if(!confirm('이 의견을 삭제할까요? 댓글도 함께 삭제됩니다.')) return;
    DB.saveOpinions(DB.opinions().filter(x=>x.id!==id));
    dropMyOp(id); toast('삭제되었습니다'); go('opinion');
  }));

  // 관리자 삭제
  $$('#main [data-admindel]').forEach(b => b.addEventListener('click', ()=>{
    const id = b.dataset.admindel;
    if(!confirm('관리자 권한으로 이 의견을 삭제합니다. 계속할까요?')) return;
    DB.saveOpinions(DB.opinions().filter(x=>x.id!==id));
    dropMyOp(id); toast('삭제되었습니다'); go('opinion');
  }));

  // 댓글 등록
  const addComment = (opId) => {
    const inp = $(`[data-cinput="${opId}"]`);
    const text = inp.value.trim();
    if(!text){ toast('댓글 내용을 입력하세요'); return; }
    const arr = DB.opinions();
    const o = arr.find(x=>x.id===opId); if(!o) return;
    const cid = uid();
    (o.comments = o.comments || []).push({ id:cid, body:text, alias:myAlias(), at:nowISO() });
    if(DB.saveOpinions(arr)){ addMyOp(cid); toast('댓글을 등록했습니다'); go('opinion'); }
  };
  $$('#main [data-cadd]').forEach(b => b.addEventListener('click', ()=> addComment(b.dataset.cadd)));
  $$('#main [data-cinput]').forEach(i => i.addEventListener('keydown', e=>{
    if(e.key==='Enter') addComment(i.dataset.cinput);
  }));

  // 댓글 삭제
  $$('#main [data-cdel]').forEach(b => b.addEventListener('click', ()=>{
    const [opId, cId] = b.dataset.cdel.split(':');
    if(!confirm('이 댓글을 삭제할까요?')) return;
    const arr = DB.opinions();
    const o = arr.find(x=>x.id===opId); if(!o) return;
    o.comments = (o.comments||[]).filter(c=>c.id!==cId);
    if(DB.saveOpinions(arr)){ dropMyOp(cId); toast('댓글을 삭제했습니다'); go('opinion'); }
  }));
};

/* ============================================================
   5) 일정 관리 (캘린더)
   ============================================================ */
const CAL = { y:new Date().getFullYear(), m:new Date().getMonth(), sel:ymd(new Date()) };
const canEvent = () => INNER.includes(SESSION.role);

VIEWS.calendar = () => {
  const evs = DB.events();
  const first = new Date(CAL.y, CAL.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(CAL.y, CAL.m+1, 0).getDate();
  const prevDays = new Date(CAL.y, CAL.m, 0).getDate();
  const today = ymd(new Date());

  const cells = [];
  for(let i=startDow-1; i>=0; i--) cells.push({ d:prevDays-i, dim:true, key:null });
  for(let d=1; d<=daysInMonth; d++) cells.push({ d, dim:false, key:`${CAL.y}-${pad(CAL.m+1)}-${pad(d)}` });
  while(cells.length % 7 !== 0) cells.push({ d:cells.length-startDow-daysInMonth+1, dim:true, key:null });

  const dows = ['일','월','화','수','목','금','토'];
  const grid = `<div class="cal">
    ${dows.map(w=>`<div class="dow">${w}</div>`).join('')}
    ${cells.map((c,i)=>{
      const dayEvs = c.key ? evs.filter(e=>e.date===c.key) : [];
      const cls = ['day', c.dim?'dim':'', c.key===today?'today':'', c.key===CAL.sel?'sel':'', i%7===0?'sun':''].filter(Boolean).join(' ');
      return `<div class="${cls}" ${c.key?`data-day="${c.key}"`:''}>
        <span class="dnum">${c.d}</span>
        ${dayEvs.slice(0,3).map(e=>`<span class="ev" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}
        ${dayEvs.length>3?`<span class="hint" style="margin:0">+${dayEvs.length-3}건</span>`:''}
      </div>`;
    }).join('')}
  </div>`;

  const selEvs = evs.filter(e=>e.date===CAL.sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const addBtn = canEvent() ? `<button class="btn primary" id="calAdd">＋ 일정 등록</button>` : '';

  return pageHead('일정 관리','새소리단 행사 일정입니다. 날짜를 눌러 그날 일정을 확인하세요.', addBtn)
  + `<div class="card">
      <div class="cal-head">
        <button class="btn sm" id="calPrev">‹ 이전달</button>
        <b>${CAL.y}년 ${CAL.m+1}월</b>
        <div class="row-actions" style="margin:0">
          <button class="btn sm ghost" id="calToday">오늘</button>
          <button class="btn sm" id="calNext">다음달 ›</button>
        </div>
      </div>
      ${grid}
    </div>
    <div class="card">
      <h2>${esc(CAL.sel)} 일정 (${selEvs.length})</h2>
      <p class="sub">${canEvent()?'단원 이상 권한으로 일정을 등록·삭제할 수 있습니다.':'일정 등록은 새소리단 단원만 가능합니다.'}</p>
      ${selEvs.length ? selEvs.map(e=>`
        <div class="post-row" style="cursor:default">
          <div class="pr-top">
            <h3>${e.time?`<span class="tag brand">${esc(e.time)}</span> `:''}${esc(e.title)}</h3>
            <span class="hint">${esc(e.author)}</span>
          </div>
          ${e.place?`<p class="excerpt" style="-webkit-line-clamp:2">📍 ${esc(e.place)}</p>`:''}
          ${e.desc?`<p class="excerpt" style="-webkit-line-clamp:3">${esc(e.desc)}</p>`:''}
          ${(canEvent() && (e.author===SESSION.name || SESSION.role==='admin'))
            ? `<div class="row-actions"><button class="btn sm danger" data-evdel="${e.id}">삭제</button></div>` : ''}
        </div>`).join('')
        : `<div class="empty">이 날짜에 등록된 일정이 없습니다.</div>`}
    </div>`;
};
BIND.calendar = () => {
  $('#calPrev').addEventListener('click', ()=>{ CAL.m--; if(CAL.m<0){ CAL.m=11; CAL.y--; } go('calendar'); });
  $('#calNext').addEventListener('click', ()=>{ CAL.m++; if(CAL.m>11){ CAL.m=0; CAL.y++; } go('calendar'); });
  $('#calToday').addEventListener('click', ()=>{
    const t = new Date(); CAL.y=t.getFullYear(); CAL.m=t.getMonth(); CAL.sel=ymd(t); go('calendar');
  });
  $$('#main [data-day]').forEach(d => d.addEventListener('click', ()=>{ CAL.sel = d.dataset.day; go('calendar'); }));
  $('#calAdd')?.addEventListener('click', ()=> openEventForm(CAL.sel));
  $$('#main [data-evdel]').forEach(b => b.addEventListener('click', ()=>{
    if(!confirm('이 일정을 삭제할까요?')) return;
    DB.saveEvents(DB.events().filter(x=>x.id!==b.dataset.evdel));
    toast('삭제되었습니다'); go('calendar');
  }));
};
function openEventForm(date){
  openModal('일정 등록', `
    <div class="grid c2">
      <label class="field">날짜 <span class="req">*</span><input id="evDate" type="date" value="${esc(date)}"></label>
      <label class="field">시간 <span class="hint" style="display:inline">선택</span><input id="evTime" type="time"></label>
    </div>
    <label class="field">행사명 <span class="req">*</span><input id="evTitle" placeholder="예) 3분기 정기 활동일"></label>
    <label class="field">장소<input id="evPlace" placeholder="예) 구청 3층 회의실"></label>
    <label class="field">상세 내용<textarea id="evDesc"></textarea></label>
    <div class="row-actions"><button class="btn primary" id="evSave">등록</button></div>`);
  $('#evSave').addEventListener('click', ()=>{
    const d = $('#evDate').value, t = $('#evTitle').value.trim();
    if(!d || !t){ toast('날짜와 행사명은 필수입니다'); return; }
    const arr = DB.events();
    arr.push({ id:uid(), date:d, time:$('#evTime').value, title:t,
               place:$('#evPlace').value.trim(), desc:$('#evDesc').value.trim(),
               author:SESSION.name, at:nowISO() });
    if(DB.saveEvents(arr)){
      CAL.sel = d;
      const dt = new Date(d); CAL.y = dt.getFullYear(); CAL.m = dt.getMonth();
      closeModal(); toast('일정을 등록했습니다'); go('calendar');
    }
  });
}

function processBlock(cur, comment){

      <select id="mdStatus">${['접수','검토중','승인','반려'].map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('')}</select>

    <button class="btn primary" id="mdSave">저장</button>`;
}
function showReport(id, canProcess){
  const r = DB.reports().find(x=>x.id===id); if(!r) return;
  let body = `<dl>
    <dt>제목</dt><dd>${esc(r.title)}</dd>
    <dt>작성자 / 팀</dt><dd>${esc(r.author)}${r.team?' · '+esc(r.team):''}</dd>
    <dt>활동일자</dt><dd>${esc(r.date)}</dd>
    <dt>활동 개요</dt><dd>${esc(r.overview)}</dd>
    <dt>주요 활동 내용</dt><dd>${esc(r.content)||'-'}</dd>
    <dt>성과 및 결과</dt><dd>${esc(r.result)||'-'}</dd>
    <dt>개선점 / 건의</dt><dd>${esc(r.improve)||'-'}</dd>
    <dt>상태</dt><dd>${statusTag(r.status)}</dd>
    ${r.comment?`<dt>담당관 코멘트</dt><dd>${esc(r.comment)}</dd>`:''}
    <dt>첨부</dt><dd>${attHTML(r.atts)}</dd>
    <dt>제출일시</dt><dd>${fmt(r.at)}</dd>
  </dl>` + (canProcess ? processBlock(r.status, r.comment) : '');
  openModal(r.title, body);
  bindZoom();
  $('#mdSave')?.addEventListener('click', ()=>{
    const arr = DB.reports(), t = arr.find(x=>x.id===id);
    t.status = $('#mdStatus').value; t.comment = $('#mdComment').value.trim();
    if(DB.saveReports(arr)){ closeModal(); toast('저장되었습니다'); go(CURRENT); }
  });
}
function showExpense(id, canProcess){
  const r = DB.expenses().find(x=>x.id===id); if(!r) return;
  const canSee = ['officer','admin'].includes(SESSION.role) || r.submittedBy===SESSION.name;
  let body = `<dl>
    <dt>신청자</dt><dd>${esc(r.submitter)}${r.contact?' · '+esc(r.contact):''}</dd>
    <dt>활동일자 / 활동명</dt><dd>${esc(r.date)} · ${esc(r.activity)}</dd>
    <dt>사용처 / 항목</dt><dd>${esc(r.item)}</dd>
    <dt>금액</dt><dd>${won(r.amount)} (${esc(r.pay)})</dd>
    ${r.bank?`<dt>입금 계좌</dt><dd>${esc(r.bank)}</dd>`:''}
    <dt>상세 / 비고</dt><dd>${esc(r.note)||'-'}</dd>
    <dt>상태</dt><dd>${statusTag(r.status)}</dd>
    ${r.comment?`<dt>담당관 코멘트</dt><dd>${esc(r.comment)}</dd>`:''}
    <dt>영수증 (${r.receipts?.length||0}장)</dt>
    <dd>${canSee ? attHTML(r.receipts) : '<span class="hint">열람 권한이 없습니다 (혁신행정담당관 전용)</span>'}</dd>
    <dt>제출일시</dt><dd>${fmt(r.at)}</dd>
  </dl>` + (canProcess ? processBlock(r.status, r.comment) : '');
  openModal('정산 신청 · ' + r.activity, body);
  bindZoom();
  $('#mdSave')?.addEventListener('click', ()=>{
    const arr = DB.expenses(), t = arr.find(x=>x.id===id);
    t.status = $('#mdStatus').value; t.comment = $('#mdComment').value.trim();
    if(DB.saveExpenses(arr)){ closeModal(); toast('저장되었습니다'); go(CURRENT); }
  });
}
function attHTML(atts){
  if(!atts || !atts.length) return '<span class="hint">첨부 없음</span>';
  return '<div class="thumbs">' + atts.map(a =>
    (a.data && a.type?.startsWith('image/'))
      ? `<img src="${a.data}" alt="${esc(a.name)}" data-zoom="${a.data}">`
      : `<span class="tag recv">📄 ${esc(a.name)}</span>`
  ).join('') + '</div>';
}

BIND.backup = () => {
  $('#bkExport').addEventListener('click', ()=>{
    const data = { posts:DB.posts(), opinions:DB.opinions(), reports:DB.reports(), expenses:DB.expenses(),
                   events:DB.events(), intro:DB.intro(), settings:DB.settings(), exportedAt:nowISO() };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'}));
    a.download = '새소리단_백업_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
  });
  $('#bkImport').addEventListener('click', ()=>{
    const f = $('#bkFile').files[0];
    if(!f){ toast('파일을 선택하세요'); return; }
    if(!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(d.posts)    DB.savePosts(d.posts);
        if(d.opinions) DB.saveOpinions(d.opinions);
        if(d.reports)  DB.saveReports(d.reports);
        if(d.expenses) DB.saveExpenses(d.expenses);
        if(d.events)   DB.saveEvents(d.events);
        if(d.intro)    DB.saveIntro(d.intro);
        if(d.settings) DB.saveSettings(d.settings);
        toast('복원되었습니다'); go('home');
      }catch(e){ toast('올바른 백업 파일이 아닙니다'); }
    };
    rd.readAsText(f);
  });
  $('#bkReset').addEventListener('click', ()=>{

/* ============================================================
   FILE HANDLING (이미지 자동 축소 → dataURL)
   ============================================================ */
async function collectFiles(fileList, imageOnly){
  const out = [];
  for(const f of fileList){
    if(f.type.startsWith('image/')){
      try{ out.push({ name:f.name, type:'image/jpeg', data: await resizeImage(f) }); }
      catch(e){ toast(f.name + ' 처리에 실패했습니다'); }
    } else if(!imageOnly){
      if(f.size <= 5*1024*1024) out.push({ name:f.name, type:f.type, data: await fileToDataURL(f) });
      else out.push({ name:f.name + ' (용량초과·파일명만 기록)', type:f.type, data:null });
    }
  }
  return out;
}
function fileToDataURL(f){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
}
function resizeImage(file, max=1280, quality=0.7){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w>max || h>max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function renderThumbs(sel, atts){
  const el = $(sel); if(!el) return;
  el.innerHTML = atts.map(a =>
    (a.data && a.type?.startsWith('image/'))
      ? `<img src="${a.data}" alt="${esc(a.name)}" data-zoom="${a.data}">`
      : `<span class="tag recv">📄 ${esc(a.name)}</span>`).join('');
  el.querySelectorAll('[data-zoom]').forEach(im => im.addEventListener('click', ()=> lightbox(im.dataset.zoom)));
}

let toastT;
function toast(msg){
  const t = $('#toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('show'), 2600);
}

  $('#modalBg').classList.add('open');
}
function closeModal(){ $('#modalBg').classList.remove('open'); }
function lightbox(src){ $('#lightboxImg').src = src; $('#lightbox').classList.add('open'); }

$('#lightbox').addEventListener('click', ()=> $('#lightbox').classList.remove('open'));

});
