<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>새소리단 관리자 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  /* 홈페이지와 같은 마젠타 강조색을 쓰되, 콘솔은 어두운 톤을 유지합니다 */
  :root{
    --bg:#0e1230; --surface:#171d47; --surface-2:#1e2555; --border:#2e3670;
    --text:#eceaff; --muted:#a2a9c6; --brand:#ff6f9c; --brand-weak:#3a1c39;
    --accent:#ff85ab;
    --ok:#4ecfa8; --ok-weak:#0f3a31; --warn:#e8b055; --warn-weak:#3a2c10;
    --danger:#ff7a9c; --danger-weak:#3f1a2b;
    --shadow:0 14px 40px rgba(0,0,0,.42);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased}
  h1,h2,h3{letter-spacing:-.03em}
  a{color:var(--brand)}
  button{font-family:inherit}
  code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:.9em}

  .app{display:grid; grid-template-columns:236px 1fr; min-height:100vh}
  .side{background:var(--surface); border-right:1px solid var(--border); padding:16px 12px;
    display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100vh; overflow-y:auto}
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 12px}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--accent),var(--brand));
    display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
  .brand b{font-size:15px;display:block;line-height:1.2}
  .brand span{font-size:11px;color:var(--muted)}
  .nav-group{font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:14px 8px 4px}
  .nav-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;
    color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:700}
  .nav-btn:hover{background:var(--surface-2)}
  .nav-btn.active{background:var(--brand-weak);color:var(--brand);font-weight:900}
  .nav-btn .ic{width:17px;text-align:center;flex:none}
  .nav-btn .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;
    padding:1px 6px;border-radius:999px}
  .side .spacer{flex:1;min-height:12px}
  .who{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12.5px}
  .who b{display:block}
  .who .role{color:var(--muted);font-size:11.5px}
  .live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:6px 4px 0}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .live.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(53,192,125,.18)}

  .btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:8px 13px;
    border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:800}
  .btn:hover{border-color:var(--brand)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:linear-gradient(150deg,var(--accent),var(--brand));border-color:transparent;color:#2a0a18}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.danger{color:var(--danger);border-color:var(--danger-weak)}
  label.field{display:block;margin-bottom:12px;font-size:12.5px;font-weight:600}
  label.field .req{color:var(--danger)}
  input,select,textarea{width:100%;margin-top:5px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font-size:13.5px;font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-weak);border-color:var(--brand)}
  .hint{font-weight:400;color:var(--muted);font-size:11.5px;margin-top:3px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

  .main{padding:24px clamp(16px,3.5vw,36px);max-width:1180px;width:100%}
  .page-head{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .page-head h1{margin:0 0 3px;font-size:26px;font-weight:900}
  .page-head p{margin:0;color:var(--muted);font-size:13.5px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 3px;font-size:17px;font-weight:900}
  .card h2+.sub{margin:0 0 14px;color:var(--muted);font-size:12.5px}
  .grid{display:grid;gap:12px}
  .grid.c2{grid-template-columns:1fr 1fr}
  .grid.c3{grid-template-columns:repeat(3,1fr)}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
  .tag.recv{background:var(--surface-2);color:var(--muted)}
  .tag.review{background:var(--warn-weak);color:var(--warn)}
  .tag.approve{background:var(--ok-weak);color:var(--ok)}
  .tag.reject{background:var(--danger-weak);color:var(--danger)}
  .tag.brand{background:var(--brand-weak);color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  tr:hover td{background:var(--surface-2)}
  .table-wrap{overflow-x:auto}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13.5px}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px}
  .stat b{font-size:25px;display:block;font-weight:900;letter-spacing:-.03em}
  .stat span{color:var(--muted);font-size:12px}
  .stat.alert{border-color:var(--warn)}
  .notice{background:var(--brand-weak);border:1px solid var(--brand);border-radius:9px;padding:11px 13px;
    font-size:12.5px;margin-bottom:14px}
  .notice.amber{background:var(--warn-weak);border-color:var(--warn)}
  .thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:76px;height:76px;object-fit:cover;border-radius:7px;border:1px solid var(--border);cursor:pointer}
  .tabs{display:flex;gap:5px;margin-bottom:16px;background:var(--surface);padding:4px;border-radius:10px;
    border:1px solid var(--border);flex-wrap:wrap}
  .tabs button{border:0;background:transparent;padding:7px 13px;border-radius:7px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--brand-weak);color:var(--brand)}
  .searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .searchbar input{margin-top:0;flex:1;min-width:180px}

  .modal-bg{position:fixed;inset:0;background:rgba(5,9,15,.7);display:none;place-items:center;z-index:50;padding:20px}
  .modal-bg.open{display:grid}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:700px;width:100%;
    max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal .m-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
    align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
  .modal .m-head b{font-size:15px}
  .modal .m-body{padding:18px}
  .modal .m-body dt{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:13px}
  .modal .m-body dd{margin:2px 0 0;white-space:pre-wrap;font-size:13.5px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:60;padding:20px}
  .lightbox.open{display:grid}
  .lightbox img{max-width:95vw;max-height:92vh;border-radius:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);
    color:var(--bg);padding:10px 17px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;z-index:80;
    pointer-events:none;max-width:88vw;text-align:center;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--brand);transform:scaleX(0);
    transform-origin:left;transition:transform .3s;z-index:90}
  .busy.on{transform:scaleX(.7)}

  .gate{min-height:100vh;display:grid;place-items:center;padding:20px}
  .gate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
    padding:28px;max-width:420px;width:100%}
  .gate-card .logo{width:44px;height:44px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--brand));
    display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:13px}

  .topbar{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
  @media (max-width:880px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:40;transform:translateX(-100%);transition:.25s}
    .side.open{transform:translateX(0)}
    .topbar{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--surface);
      border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
    .scrim.open{display:block}
    .stat-row{grid-template-columns:1fr 1fr}
    .grid.c2,.grid.c3{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="busy" id="busy"></div>

<!-- ============ 접근 게이트 ============ -->
<div id="gate" class="gate">
  <div class="gate-card" id="gateCard">
    <div class="logo">🛠</div>
    <h1 style="margin:0 0 4px;font-size:19px">새소리단 관리자 콘솔</h1>
    <p style="margin:0;color:var(--muted);font-size:13px" id="gateMsg">연결 중…</p>
    <div id="gateForm" style="display:none;margin-top:18px">
      <label class="field">이메일<input id="gEmail" type="email" autocomplete="username"></label>
      <label class="field">비밀번호<input id="gPw" type="password" autocomplete="current-password"></label>
      <button class="btn primary" style="width:100%" id="gLogin">로그인</button>
    </div>
    <div class="row-actions" style="margin-top:16px" id="gateActions"></div>
  </div>
</div>

<!-- ============ 콘솔 ============ -->
<div id="app" class="app" style="display:none">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">🛠</div><div><b>관리자 콘솔</b><span>새소리단</span></div></div>
    <div id="navArea"></div>
    <div class="spacer"></div>
    <div class="live" id="liveBox"><i></i><span>연결 중…</span></div>
    <div class="who" id="whoBox" style="margin-top:6px"></div>
    <div class="row-actions" style="margin-top:8px">
      <button class="btn ghost sm" id="viewSite">홈페이지 보기</button>
      <button class="btn ghost sm" id="logoutBtn">로그아웃</button>
    </div>
  </aside>
  <div style="min-width:0">
    <div class="topbar"><button class="btn ghost sm" id="menuToggle">☰ 메뉴</button><b id="topTitle">대시보드</b></div>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<div class="modal-bg" id="modalBg"><div class="modal">
  <div class="m-head"><b id="modalTitle"></b><button class="btn ghost sm" id="modalClose">닫기</button></div>
  <div class="m-body" id="modalBody"></div>
</div></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="첨부 이미지"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================================
   새소리단 관리자 콘솔 (admin.html)
   · index.html 과 같은 Supabase 프로젝트를 사용합니다. 접속 정보도 공유합니다.
   · 여기서 저장하면 홈페이지에 실시간으로 반영됩니다 (새로고침 불필요).
   · 혁신행정담당관 이상만 들어올 수 있습니다.
   ============================================================================ */
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

const BAKED = {
  url:'https://lixuhimwutyiqshzamtp.supabase.co',
  anonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeHVoaW13dXR5aXFzaHphbXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjk5MzUsImV4cCI6MjEwMzcwNTkzNX0.6Du-Koz6SOyKuB2KiUfETq4qBZ78ytSiyHgBkgEYgLE'
};
function getConfig(){
  if(BAKED.url && BAKED.anonKey) return BAKED;
  try{ return JSON.parse(localStorage.getItem('sb_cfg')||'null') || {url:'',anonKey:''}; }
  catch(e){ return {url:'',anonKey:''}; }
}
let sb = null;

const pad = n => String(n).padStart(2,'0');
const nowISO = () => new Date().toISOString();
const fmt = iso => { if(!iso) return '-'; const d=new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDay = iso => iso ? String(iso).slice(0,10) : '-';
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const won = n => (Number(n)||0).toLocaleString('ko-KR') + '원';
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const excerpt = (s,n=100) => { const t=String(s||'').replace(/\s+/g,' ').trim(); return t.length>n?t.slice(0,n)+'…':t; };

let toastT;
function toast(m){ const t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3000); }
const busy = on => $('#busy').classList.toggle('on', !!on);
function failed(where, e){
  console.error(where, e);
  const m = e?.message || String(e);
  if(/row-level security|violates row-level/i.test(m)) toast(`${where}: 권한이 없습니다.`);
  else if(/JWT|session/i.test(m)) toast(`${where}: 로그인이 만료되었습니다.`);
  else if(/Failed to fetch|NetworkError/i.test(m)) toast(`${where}: 서버에 연결하지 못했습니다.`);
  else toast(`${where}: ${m}`);
}

/* ---------- 상태 ---------- */
const S = { user:null, profile:null, posts:[], opinions:[], comments:[],
            reports:[], expenses:[], events:[], site:null, profiles:[],
            visits:null, visitSeries:[], visitReady:false };
const SIGNED = {};
const role = () => S.profile?.role || 'visitor';
const myName = () => S.profile?.name || '';
const isAdmin = () => role()==='admin';
const isOfficer = () => ['officer','admin'].includes(role());
const ROLE_LABEL = { visitor:'일반 방문자', member:'새소리단 단원', officer:'혁신행정담당관', admin:'운영 관리자' };

const BOARDS = {
  news:   { label:'새소리단 소식', icon:'📰', photo:true,  adminOnly:false },
  notice: { label:'공지방',       icon:'📢', photo:false, adminOnly:false },
  free:   { label:'자유방',       icon:'💭', photo:false, adminOnly:false },
  share:  { label:'활동 공유방',   icon:'📸', photo:true,  adminOnly:false },
};

const DEFAULT_INTRO = {
  mission:'', roles:[], history:[], teams:[]
};
const intro = () => (S.site?.intro && S.site.intro.teams) ? S.site.intro : DEFAULT_INTRO;

const MENUS = [
  { id:'dash',    icon:'📊', label:'대시보드',      group:'현황', roles:['officer','admin'] },
  { id:'visits',  icon:'📈', label:'방문자 통계',    group:'현황', roles:['officer','admin'] },
  { id:'posts',   icon:'📝', label:'게시글 관리',    group:'콘텐츠', roles:['officer','admin'] },
  { id:'events',  icon:'📅', label:'일정 관리',      group:'콘텐츠', roles:['officer','admin'] },
  { id:'intro',   icon:'🐦', label:'소개 편집',      group:'콘텐츠', roles:['admin'] },
  { id:'game',    icon:'🎮', label:'게임 등록',      group:'콘텐츠', roles:['admin'] },
  { id:'reports', icon:'✅', label:'결과보고서',     group:'심사', roles:['officer','admin'] },
  { id:'exps',    icon:'💳', label:'활동비 정산',    group:'심사', roles:['officer','admin'] },
  { id:'opinions',icon:'💬', label:'의견함 관리',    group:'심사', roles:['officer','admin'] },
  { id:'members', icon:'👥', label:'회원 · 권한',    group:'운영', roles:['officer','admin'] },
];
const can = id => { const m = MENUS.find(x=>x.id===id); return !!m && m.roles.includes(role()); };

/* ============================================================================
   로드
   ============================================================================ */
async function loadProfile(){
  const { data:{ user } } = await sb.auth.getUser();
  S.user = user;
  if(!user) return false;
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  S.profile = data || { id:user.id, name:'', role:'visitor' };
  return true;
}

async function refresh(){
  busy(true);
  try{
    await loadProfile();
    if(!isOfficer()){ showGate(); return; }
    const res = await Promise.all([
      sb.from('site').select('*').eq('id',1).maybeSingle(),
      sb.from('posts').select('*').order('created_at',{ascending:false}),
      sb.from('opinions').select('*').order('created_at',{ascending:false}),
      sb.from('opinion_comments').select('*').order('created_at'),
      sb.from('events').select('*').order('ev_date'),
      sb.from('reports').select('*').order('created_at',{ascending:false}),
      sb.from('expenses').select('*').order('created_at',{ascending:false}),
      sb.from('profiles').select('*').order('created_at'),
    ]);
    const bad = res.find(r=>r.error); if(bad) throw bad.error;
    S.site=res[0].data; S.posts=res[1].data||[]; S.opinions=res[2].data||[];
    S.comments=res[3].data||[]; S.events=res[4].data||[]; S.reports=res[5].data||[];
    S.expenses=res[6].data||[]; S.profiles=res[7].data||[];

    // 방문자 집계 (함수가 아직 없으면 조용히 건너뜁니다)
    const [st, se] = await Promise.all([ sb.rpc('visit_stats'), sb.rpc('visit_series',{ days:14 }) ]);
    S.visits = st.error ? null : st.data;
    S.visitSeries = se.error ? [] : (se.data||[]);
    S.visitReady = !st.error;

    await signDocs();
  }catch(e){ failed('데이터를 불러오지 못했습니다', e); }
  finally{ busy(false); }
}
async function signDocs(){
  const paths=[];
  S.expenses.forEach(e=>(e.receipts||[]).forEach(f=>f.path&&paths.push(f.path)));
  S.reports.forEach(r=>(r.files||[]).forEach(f=>f.path&&paths.push(f.path)));
  const need=[...new Set(paths)].filter(p=>!SIGNED[p]);
  if(!need.length) return;
  const { data, error } = await sb.storage.from('docs').createSignedUrls(need, 3600);
  if(error){ console.warn('signDocs', error); return; }
  (data||[]).forEach(d=>{ if(d.signedUrl) SIGNED[d.path]=d.signedUrl; });
}
const mediaUrl = p => sb.storage.from('media').getPublicUrl(p).data.publicUrl;
const fileUrl  = f => f?.path ? (SIGNED[f.path]||'') : '';

/* ============================================================================
   게이트 (권한 확인)
   ============================================================================ */
function showGate(msg, mode){
  $('#app').style.display='none';
  $('#gate').style.display='grid';
  $('#gateMsg').textContent = msg || '';
  $('#gateForm').style.display = mode==='login' ? 'block' : 'none';
  const acts = $('#gateActions');
  acts.innerHTML = mode==='login' ? '' :
    `<button class="btn" onclick="location.href='index.html'">홈페이지로 가기</button>
     <button class="btn ghost" id="gOut">다른 계정으로 로그인</button>`;
  $('#gOut')?.addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });
  if(mode==='login'){
    $('#gLogin').onclick = doLogin;
    ['#gEmail','#gPw'].forEach(s=>$(s).onkeydown = e=>{ if(e.key==='Enter') doLogin(); });
  }
}
async function doLogin(){
  const email=$('#gEmail').value.trim(), pw=$('#gPw').value;
  if(!email||!pw){ toast('이메일과 비밀번호를 입력하세요'); return; }
  busy(true);
  const { error } = await sb.auth.signInWithPassword({ email, password:pw });
  busy(false);
  if(error){
    if(/Invalid login credentials/i.test(error.message)) toast('이메일 또는 비밀번호가 올바르지 않습니다.');
    else failed('로그인', error);
    return;
  }
  await start();
}
async function start(){
  if(!await loadProfile()){ showGate('관리자 계정으로 로그인하세요.', 'login'); return; }
  if(S.user.is_anonymous){
    showGate('익명 상태입니다. 관리자 계정으로 로그인하세요.', 'login'); return;
  }
  if(!isOfficer()){
    showGate(`${myName()||'이 계정'} 님은 현재 "${ROLE_LABEL[role()]}" 권한입니다. `
           + '관리자 콘솔은 혁신행정담당관 이상만 들어올 수 있습니다.');
    return;
  }
  await refresh();
  showConsole();
}
function showConsole(){
  $('#gate').style.display='none';
  $('#app').style.display='grid';
  renderNav();
  paintWho();
  const start0 = location.hash.replace('#','') || 'dash';
  go(can(start0) ? start0 : 'dash');
  subscribeRealtime();
}

   ============================================================================ */
let channel=null, rtTimer=null;
function subscribeRealtime(){
  if(channel) return;
  const tables = ['posts','opinions','opinion_comments','events','profiles','site','reports','expenses'];
  channel = sb.channel('saesori-admin');
  tables.forEach(t => channel.on('postgres_changes', { event:'*', schema:'public', table:t }, queueRefresh));
  channel.subscribe(status=>{
    const on = status === 'SUBSCRIBED';
    const box = $('#liveBox');
    box.classList.toggle('on', on);
    box.querySelector('span').textContent = on ? '실시간 연결됨' : '연결 대기 중';
  });
}
function queueRefresh(){
  clearTimeout(rtTimer);
  rtTimer = setTimeout(async ()=>{
    const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
    const modal = $('#modalBg').classList.contains('open');
    await refresh();
    if(!typing && !modal) go(CURRENT);
  }, 900);
}

function renderNav(){
  const pendR = S.reports.filter(x=>!['승인','반려'].includes(x.status)).length;
  const pendE = S.expenses.filter(x=>!['승인','반려'].includes(x.status)).length;
  const badges = { reports:pendR, exps:pendE };
  const groups={};
  MENUS.filter(m=>m.roles.includes(role())).forEach(m=>(groups[m.group]=groups[m.group]||[]).push(m));
  let html='';
  Object.entries(groups).forEach(([g,items])=>{
    html += `<div class="nav-group">${esc(g)}</div>`;
    items.forEach(m=>{
      const b = badges[m.id];
      html += `<button class="nav-btn" data-go="${m.id}"><span class="ic">${m.icon}</span>${esc(m.label)}`
            + (b ? `<span class="badge">${b}</span>` : '') + `</button>`;
    });
  });
  $('#navArea').innerHTML = html;
  $$('#navArea .nav-btn').forEach(b=>b.addEventListener('click',()=>{ go(b.dataset.go); closeSide(); }));
}
let CURRENT='dash';
function go(id){
  if(!can(id)) id='dash';
  CURRENT=id;
  try{ location.hash=id }catch(e){}
  $$('#navArea .nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.go===id));
  const m=MENUS.find(x=>x.id===id);
  $('#topTitle').textContent = m?m.label:'';
  $('#main').innerHTML = (VIEWS[id]||VIEWS.dash)();
  if(BIND[id]) BIND[id]();
  renderNav();
  $$('#navArea .nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.go===id));
  window.scrollTo(0,0);
}

function postForm(board, editId){
  const p = editId ? S.posts.find(x=>x.id===editId) : null;

  openModal(p ? '글 수정' : '새 글 쓰기', `
    <label class="field">게시판
      <select id="fBoard" ${p?'disabled':''}>${Object.entries(BOARDS).map(([k,b])=>
        `<option value="${k}" ${k===key?'selected':''}>${b.icon} ${esc(b.label)}</option>`).join('')}</select>
      ${p?'<span class="hint">게시판은 바꿀 수 없습니다. 옮기려면 삭제 후 다시 작성하세요.</span>':''}
    </label>
    <label class="field">제목 <span class="req">*</span><input id="fTitle" value="${esc(p?.title||'')}"></label>
    <label class="field">내용 <span class="req">*</span><textarea id="fBody" style="min-height:160px">${esc(p?.body||'')}</textarea></label>
    <label class="field">사진 추가<input id="fFiles" type="file" multiple accept="image/*">
      <span class="hint">소식·활동 공유방은 첫 사진이 홈페이지 목록에 크게 표시됩니다.</span></label>
    <div class="thumbs" id="fNew"></div>
    ${p && (p.images||[]).length ? `<label class="field" style="margin-top:10px">기존 사진 <span class="hint" style="display:inline">클릭하면 삭제 표시됩니다</span></label>
      <div class="thumbs" id="fOld">${p.images.map((im,i)=>
        `<img src="${esc(mediaUrl(im.path))}" data-old="${i}" title="클릭하면 삭제" alt="">`).join('')}</div>` : ''}
    <label class="field" style="display:flex;align-items:center;gap:8px;margin-top:14px">
      <input type="checkbox" id="fPin" style="width:auto;margin:0" ${p?.pinned?'checked':''}> 상단 고정(공지)</label>
    <div class="row-actions"><button class="btn primary" id="fSave">${p?'수정 저장':'등록'}</button>
      <button class="btn ghost" id="fCancel">취소</button></div>`);

  let picked=[], removed=new Set();
  $('#fFiles').addEventListener('change', async e=>{
    picked = await prepImages(e.target.files);
    $('#fNew').innerHTML = picked.map(x=>`<img src="${x.preview}" alt="">`).join('');
  });
  $$('#modalBody [data-old]').forEach(im=>im.addEventListener('click',()=>{
    const i = +im.dataset.old;
    if(removed.has(i)){ removed.delete(i); im.style.opacity=''; im.style.outline=''; }
    else { removed.add(i); im.style.opacity='.35'; im.style.outline='2px solid var(--danger)'; }
  }));
  $('#fCancel').addEventListener('click', closeModal);
  $('#fSave').addEventListener('click', async ()=>{
    const title=$('#fTitle').value.trim(), body=$('#fBody').value.trim();
    if(!title||!body){ toast('제목과 내용을 입력하세요'); return; }
    const btn=$('#fSave'); btn.disabled=true; busy(true);
    try{
      const uploaded = await uploadAll('media', picked, 'posts');
      if(p){
        const kept = (p.images||[]).filter((_,i)=>!removed.has(i));
        const gone = (p.images||[]).filter((_,i)=>removed.has(i));
        const { error } = await sb.from('posts').update({
          title, body, images:[...kept, ...uploaded], pinned:$('#fPin').checked }).eq('id', p.id);
        if(error) throw error;
        if(gone.length) await sb.storage.from('media').remove(gone.map(g=>g.path));
      }else{
        const { error } = await sb.from('posts').insert({
          board:$('#fBoard').value, title, body, images:uploaded,
          author_id:S.user.id, author_name:myName(), pinned:$('#fPin').checked });
        if(error) throw error;
      }
      await refresh(); closeModal();
      toast(p ? '수정되었습니다. 홈페이지에 즉시 반영됩니다.' : '등록되었습니다. 홈페이지에 즉시 반영됩니다.');
      go(CURRENT);
    }catch(e){ failed(p?'글 수정':'글 등록', e); btn.disabled=false; }
    finally{ busy(false); }
  });
}
async function delPost(id){
  const p = S.posts.find(x=>x.id===id); if(!p) return;
  if(!confirm(`"${p.title}" 글을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  busy(true);
  const { error } = await sb.from('posts').delete().eq('id', id);
  if(!error && (p.images||[]).length) await sb.storage.from('media').remove(p.images.map(i=>i.path));
  busy(false);
  if(error) return failed('글 삭제', error);
  await refresh(); toast('삭제되었습니다'); go(CURRENT);
}

/* ---------- 일정 ---------- */
VIEWS.events = () => {
  const today = ymd(new Date());
  const up = S.events.filter(e=>e.ev_date>=today);
  const past = S.events.filter(e=>e.ev_date<today).reverse();
  const row = e => `<tr><td>${esc(e.ev_date)}${e.ev_time?` <span class="tag brand">${esc(e.ev_time)}</span>`:''}</td>
    <td>${esc(e.title)}${e.descr?`<div class="hint">${esc(excerpt(e.descr,60))}</div>`:''}</td>
    <td>${esc(e.place||'-')}</td><td>${esc(e.author_name)}</td>
    <td><button class="btn sm danger" data-delev="${e.id}">삭제</button></td></tr>`;
  return pageHead('일정 관리','등록한 일정은 홈페이지 캘린더에 즉시 표시됩니다.',
    `<button class="btn primary" id="newEv">＋ 일정 등록</button>`)
  + `<div class="card"><h2>예정된 일정 (${up.length})</h2>
      ${up.length ? table(['날짜','행사명','장소','등록자',''])+up.map(row).join('')+tableEnd
        : `<div class="empty">예정된 일정이 없습니다.</div>`}</div>
    <div class="card"><h2>지난 일정 (${past.length})</h2>
      ${past.length ? table(['날짜','행사명','장소','등록자',''])+past.slice(0,20).map(row).join('')+tableEnd
        : `<div class="empty">지난 일정이 없습니다.</div>`}</div>`;
};
BIND.events = () => {
  $('#newEv').addEventListener('click', evForm);
  $$('#main [data-delev]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('이 일정을 삭제할까요?')) return;
    busy(true);
    const { error } = await sb.from('events').delete().eq('id', b.dataset.delev);
    busy(false);
    if(error) return failed('일정 삭제', error);
    await refresh(); toast('삭제되었습니다'); go('events');
  }));
};
function evForm(){
  openModal('일정 등록', `
    <div class="grid c2">
      <label class="field">날짜 <span class="req">*</span><input id="eDate" type="date" value="${ymd(new Date())}"></label>
      <label class="field">시간<input id="eTime" type="time"></label></div>
    <label class="field">행사명 <span class="req">*</span><input id="eTitle" placeholder="예) 3분기 정기 활동일"></label>
    <label class="field">장소<input id="ePlace" placeholder="예) 구청 3층 회의실"></label>
    <label class="field">상세 내용<textarea id="eDesc"></textarea></label>
    <div class="row-actions"><button class="btn primary" id="eSave">등록</button>
      <button class="btn ghost" onclick="closeModal()">취소</button></div>`);
  $('#eSave').addEventListener('click', async ()=>{
    const d=$('#eDate').value, t=$('#eTitle').value.trim();
    if(!d||!t){ toast('날짜와 행사명은 필수입니다'); return; }
    const btn=$('#eSave'); btn.disabled=true; busy(true);
    const { error } = await sb.from('events').insert({ ev_date:d, ev_time:$('#eTime').value, title:t,
      place:$('#ePlace').value.trim(), descr:$('#eDesc').value.trim(),
      author_id:S.user.id, author_name:myName() });
    busy(false); btn.disabled=false;
    if(error) return failed('일정 등록', error);
    await refresh(); closeModal(); toast('등록되었습니다. 홈페이지에 즉시 반영됩니다.'); go('events');
  });
}

BIND.intro = () => {

  $('#iSave').addEventListener('click', async ()=>{
    const obj = {
      mission:$('#iMission').value.trim(),

        return { year:(y||'').trim(), text:r.join('|').trim() }; }),
      teams:lines($('#iTeams').value).map(l=>{ const p=l.split('|');
        return { name:(p[0]||'').trim(), lead:(p[1]||'').trim(), desc:(p.slice(2).join('|')||'').trim() }; })

/* ---------- 의견함 ---------- */
VIEWS.opinions = () => {
  const q=(Q.oq||'').toLowerCase();
  const cmts = id => S.comments.filter(c=>c.opinion_id===id);
  let list = S.opinions.slice();
  if(q) list = list.filter(o=>(o.body+' '+o.cat+' '+o.alias).toLowerCase().includes(q));
  return pageHead('의견함 관리','시민이 남긴 의견입니다. 개인정보가 담긴 글은 삭제할 수 있습니다.')
  + `<div class="searchbar"><input id="oq" value="${esc(Q.oq||'')}" placeholder="내용·별칭 검색">
      <button class="btn" id="oqGo">검색</button>
      ${q?`<button class="btn ghost" id="oqClear">초기화</button>`:''}</div>
    <div class="card">${list.length ? table(['분류','별칭','내용','댓글','접수','']) + list.map(o=>`<tr>
      <td><span class="tag brand">${esc(o.cat)}</span></td><td>${esc(o.alias)}</td>
      <td style="max-width:340px">${esc(excerpt(o.body,110))}</td>
      <td>${cmts(o.id).length}</td><td class="hint">${fmtDay(o.created_at)}</td>
      <td><div class="row-actions" style="margin:0">
        <button class="btn sm" data-opview="${o.id}">보기</button>
        ${isAdmin()?`<button class="btn sm danger" data-opdel="${o.id}">삭제</button>`:''}</div></td></tr>`).join('')+tableEnd
      : `<div class="empty">${q?'검색 결과가 없습니다.':'접수된 의견이 없습니다.'}</div>`}</div>
    <div class="notice">의견함은 의견을 받기만 하는 공간입니다. 처리 상태는 두지 않습니다.
      개인정보가 담겼거나 부적절한 글은 <b>삭제</b>로 내릴 수 있습니다.</div>`;
};
BIND.opinions = () => {
  const run=()=>{ Q.oq=$('#oq').value.trim(); go('opinions'); };
  $('#oqGo').addEventListener('click',run);
  $('#oq').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  $('#oqClear')?.addEventListener('click',()=>{ Q.oq=''; go('opinions'); });
  $$('#main [data-opview]').forEach(b=>b.addEventListener('click',()=>{
    const o=S.opinions.find(x=>x.id===b.dataset.opview); if(!o) return;
    const cs=S.comments.filter(c=>c.opinion_id===o.id);
    openModal(`${o.cat} · ${o.alias}`, `<dl>
      <dt>내용</dt><dd>${esc(o.body)}</dd>
      <dt>접수일시</dt><dd>${fmt(o.created_at)}</dd>
      <dt>댓글 (${cs.length})</dt><dd>${cs.length ? cs.map(c=>
        `<div style="border-bottom:1px solid var(--border);padding:8px 0">
          <b style="font-size:12.5px">${esc(c.alias)}</b>
          <span class="hint">${fmt(c.created_at)}</span><div>${esc(c.body)}</div></div>`).join('')
        : '<span class="hint">댓글 없음</span>'}</dd></dl>`);
  }));
  $$('#main [data-opdel]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('이 의견을 삭제할까요? 댓글도 함께 삭제됩니다.')) return;
    busy(true);
    const { error } = await sb.from('opinions').delete().eq('id', b.dataset.opdel);
    busy(false);
    if(error) return failed('의견 삭제', error);
    await refresh(); toast('삭제되었습니다'); go('opinions');

/* ---------- 심사 모달 ---------- */
function processBlock(cur, comment){
  return `<hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
    <label class="field">처리 상태<select id="mStatus">
      ${['접수','검토중','승인','반려'].map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="field">코멘트 (반려 사유 등)<textarea id="mComment">${esc(comment||'')}</textarea></label>
    <button class="btn primary" id="mSave">저장</button>`;
}
function showReport(id){
  const r=S.reports.find(x=>x.id===id); if(!r) return;
  openModal(r.title, `<dl>
    <dt>작성자 / 팀</dt><dd>${esc(r.author_name)}${r.team?' · '+esc(r.team):''}</dd>
    <dt>활동일자</dt><dd>${esc(r.act_date)}</dd>
    <dt>활동 개요</dt><dd>${esc(r.overview)}</dd>
    <dt>주요 활동 내용</dt><dd>${esc(r.content)||'-'}</dd>
    <dt>성과 및 결과</dt><dd>${esc(r.result)||'-'}</dd>
    <dt>개선점 / 건의</dt><dd>${esc(r.improve)||'-'}</dd>
    <dt>첨부</dt><dd>${attHTML(r.files)}</dd>
    <dt>제출일시</dt><dd>${fmt(r.created_at)}</dd></dl>` + processBlock(r.status, r.officer_comment));
  bindZoom();
  $('#mSave').addEventListener('click', async ()=>{
    busy(true);
    const { error } = await sb.from('reports')
      .update({ status:$('#mStatus').value, officer_comment:$('#mComment').value.trim() }).eq('id', id);
    busy(false);
    if(error) return failed('보고서 처리', error);
    await refresh(); closeModal(); toast('저장되었습니다. 제출자 화면에 즉시 반영됩니다.'); go(CURRENT);
  });
}
function showExpense(id){
  const r=S.expenses.find(x=>x.id===id); if(!r) return;
  openModal('정산 · '+r.activity, `<dl>
    <dt>신청자</dt><dd>${esc(r.author_name)}${r.contact?' · '+esc(r.contact):''}</dd>
    <dt>활동일자 / 활동명</dt><dd>${esc(r.act_date)} · ${esc(r.activity)}</dd>
    <dt>사용처 / 항목</dt><dd>${esc(r.item)}</dd>
    <dt>금액</dt><dd>${won(r.amount)} (${esc(r.pay_method)})</dd>
    ${r.bank?`<dt>입금 계좌</dt><dd>${esc(r.bank)}</dd>`:''}
    <dt>상세 / 비고</dt><dd>${esc(r.note)||'-'}</dd>
    <dt>영수증 (${(r.receipts||[]).length}장)</dt><dd>${attHTML(r.receipts)}</dd>
    <dt>제출일시</dt><dd>${fmt(r.created_at)}</dd></dl>` + processBlock(r.status, r.officer_comment));
  bindZoom();
  $('#mSave').addEventListener('click', async ()=>{
    busy(true);
    const { error } = await sb.from('expenses')
      .update({ status:$('#mStatus').value, officer_comment:$('#mComment').value.trim() }).eq('id', id);
    busy(false);
    if(error) return failed('정산 처리', error);
    await refresh(); closeModal(); toast('저장되었습니다. 신청자 화면에 즉시 반영됩니다.'); go(CURRENT);
  });
}
function attHTML(files){
  if(!files||!files.length) return '<span class="hint">첨부 없음</span>';
  return '<div class="thumbs">'+files.map(f=>{
    const u=fileUrl(f);
    return u ? `<img src="${esc(u)}" data-zoom="${esc(u)}" alt="${esc(f.name||'')}">`
             : `<span class="tag recv">🔒 ${esc(f.name||'파일')}</span>`;
  }).join('')+'</div>';
}
function bindZoom(){ $$('#modalBody [data-zoom]').forEach(im=>
  im.addEventListener('click',()=>lightbox(im.dataset.zoom))); }

/* ============================================================================
   파일
   ============================================================================ */
async function prepImages(list){
  const out=[];
  for(const f of list){
    if(!f.type.startsWith('image/')){ toast(`${f.name}: 이미지만 첨부할 수 있습니다`); continue; }
    try{
      const blob = await resizeToBlob(f);
      out.push({ blob, name:f.name.replace(/\.[^.]+$/,'')+'.jpg', preview:URL.createObjectURL(blob) });
    }catch(e){ toast(`${f.name} 처리 실패`); }
  }
  return out;
}
function resizeToBlob(file, max=1600, q=0.75){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('canvas')),'image/jpeg',q);
      };
      img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
async function uploadAll(bucket, picked, folder){
  const out=[];
  for(const p of picked){
    const path=`${folder}/${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await sb.storage.from(bucket).upload(path, p.blob, { contentType:'image/jpeg' });
    if(error) throw error;
    out.push({ path, name:p.name });
  }
  return out;
}

/* ============================================================================
   UI 공통
   ============================================================================ */
function openModal(t,h){ $('#modalTitle').textContent=t; $('#modalBody').innerHTML=h; $('#modalBg').classList.add('open'); }
function closeModal(){ $('#modalBg').classList.remove('open'); }
function lightbox(src){ $('#lightboxImg').src=src; $('#lightbox').classList.add('open'); }
$('#modalClose').addEventListener('click', closeModal);
$('#modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
$('#lightbox').addEventListener('click', ()=>$('#lightbox').classList.remove('open'));
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if($('#lightbox').classList.contains('open')) $('#lightbox').classList.remove('open');
  else closeModal();
});
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#menuToggle').addEventListener('click',()=>{ $('#side').classList.toggle('open'); $('#scrim').classList.toggle('open'); });
$('#scrim').addEventListener('click', closeSide);
$('#viewSite').addEventListener('click',()=>window.open('index.html','_blank'));
$('#logoutBtn').addEventListener('click', async ()=>{
  if(channel){ sb.removeChannel(channel); channel=null; }
  await sb.auth.signOut(); location.reload();
});
window.addEventListener('hashchange',()=>{
  if(!S.user) return;
  const id=location.hash.replace('#','');
  if(id&&id!==CURRENT) go(id);
});

/* ============================================================================
   시작
   ============================================================================ */
(async function boot(){
  const cfg=getConfig();
  if(!cfg.url||!cfg.anonKey){
    showGate('아직 Supabase에 연결되지 않았습니다. 먼저 홈페이지(index.html)에서 접속 정보를 입력하세요.');
    return;
  }
  if(!window.supabase?.createClient){
    showGate('라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
    // storageKey를 지정하지 않아야 index.html과 로그인 상태를 공유합니다
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await start();
  else showGate('관리자 계정으로 로그인하세요.', 'login');
})();
</script>
